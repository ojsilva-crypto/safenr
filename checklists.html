<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Checklists</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#818cf8,#6366f1);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(129,140,248,.12);border-color:#818cf8;color:#818cf8}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#818cf8}
    .checks-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .check-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;transition:all .2s}
    .check-card:hover{background:rgba(255,255,255,.05)}
    .check-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
    .check-titulo{font-size:.95rem;font-weight:700;flex:1}
    .badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
    .badge.pendente{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.concluido{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.em-andamento{background:rgba(96,165,250,.15);color:#60a5fa}
    .badge.cancelado{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .check-info{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;font-size:.78rem;color:rgba(255,255,255,.45)}
    .check-itens-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;margin-bottom:14px;max-height:160px;overflow-y:auto}
    .check-item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82rem}
    .check-item-row:last-child{border-bottom:none}
    .check-item-status{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
    .status-ok{background:rgba(74,222,128,.2);color:#4ade80}
    .status-nok{background:rgba(248,113,113,.2);color:#f87171}
    .status-na{background:rgba(255,255,255,.1);color:rgba(255,255,255,.4)}
    .status-pend{background:rgba(251,191,36,.15);color:#fbbf24}
    .prog-bar{height:4px;background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden;margin-bottom:14px}
    .prog-fill{height:100%;background:linear-gradient(90deg,#818cf8,#6366f1);border-radius:20px;transition:width .5s}
    .check-acoes{display:flex;gap:8px;justify-content:flex-end}
    .btn-acao{background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:6px 12px;font-size:.8rem;color:rgba(255,255,255,.6);transition:all .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus{border-color:#818cf8}
    .form-group select option{background:#1a2535}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .secao-titulo{font-size:.78rem;font-weight:800;color:#818cf8;text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(129,140,248,.15)}
    .itens-editor{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
    .item-editor-row{display:flex;align-items:center;gap:8px}
    .item-editor-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 12px;color:#fff;font-size:.85rem;outline:none}
    .item-editor-row input:focus{border-color:#818cf8}
    .item-editor-row select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 10px;color:#fff;font-size:.82rem;outline:none;width:110px}
    .item-editor-row select option{background:#1a2535}
    .btn-rem-item{background:rgba(248,113,113,.1);border:none;border-radius:6px;color:#f87171;cursor:pointer;padding:6px 10px;font-size:.8rem}
    .btn-add-item{background:rgba(129,140,248,.12);border:1px dashed rgba(129,140,248,.3);border-radius:8px;color:#818cf8;cursor:pointer;padding:10px;font-size:.85rem;width:100%;transition:all .2s;margin-top:4px}
    .btn-add-item:hover{background:rgba(129,140,248,.2)}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#818cf8,#6366f1);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>📋 Checklists de Segurança</h2><span id="totalRegistros">0 registros</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo Checklist</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-pendente" style="color:#fbbf24">0</div>
      <div class="rc-label">Pendentes</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-andamento" style="color:#60a5fa">0</div>
      <div class="rc-label">Em Andamento</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-concluido" style="color:#4ade80">0</div>
      <div class="rc-label">Concluidos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-nok" style="color:#f87171">0</div>
      <div class="rc-label">Itens NOK</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"  onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-pend"  onclick="filtrar('pendente',this)">🟡 Pendentes</button>
    <button class="filtro-btn" id="fb-and"   onclick="filtrar('em-andamento',this)">🔵 Andamento</button>
    <button class="filtro-btn" id="fb-conc"  onclick="filtrar('concluido',this)">✅ Concluidos</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar checklist..." oninput="renderizar(getLista())"/>
  </div>
  <div class="checks-grid" id="checksGrid"></div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">📋 Novo Checklist</h3>
    <div class="secao-titulo">Identificação</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Título do Checklist *</label>
        <input type="text" id="f_titulo" placeholder="Ex: Inspeção de EPI — Produção"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Responsável</label>
        <input type="text" id="f_resp" placeholder="Nome do responsável"/>
      </div>
      <div class="form-group">
        <label>Data *</label>
        <input type="date" id="f_data"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Local / Setor</label>
        <input type="text" id="f_local" placeholder="Ex: Almoxarifado"/>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f_status">
          <option value="pendente">Pendente</option>
          <option value="em-andamento">Em Andamento</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </div>
    <div class="secao-titulo">Itens do Checklist</div>
    <div class="itens-editor" id="itensEditor"></div>
    <button class="btn-add-item" onclick="addItem()">+ Adicionar Item</button>
    <div class="form-row" style="margin-top:16px">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_checklists')||'[]');
var editandoId=null,filtroAtivo='';
function salvarStorage(){localStorage.setItem('safenr_checklists',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    if(filtroAtivo&&r.status!==filtroAtivo)return false;
    if(busca&&!(r.titulo||'').toLowerCase().includes(busca)&&!(r.responsavel||'').toLowerCase().includes(busca)&&!(r.local||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function totalNok(){return registros.reduce(function(a,r){return a+(r.itens||[]).filter(function(i){return i.status==='nok';}).length;},0);}
function atualizarContadores(){
  document.getElementById('cnt-pendente').textContent=registros.filter(function(r){return r.status==='pendente';}).length;
  document.getElementById('cnt-andamento').textContent=registros.filter(function(r){return r.status==='em-andamento';}).length;
  document.getElementById('cnt-concluido').textContent=registros.filter(function(r){return r.status==='concluido';}).length;
  document.getElementById('cnt-nok').textContent=totalNok();
  document.getElementById('totalRegistros').textContent=registros.length+' registro(s)';
}
function renderizar(lista){
  var grid=document.getElementById('checksGrid');
  grid.innerHTML='';atualizarContadores();
  if(lista.length===0){grid.innerHTML='<div class="empty-state"><div>📋</div><p>Nenhum checklist encontrado.<br>Clique em <strong>+ Novo Checklist</strong>.</p></div>';return;}
  lista.sort(function(a,b){return (b.data||'').localeCompare(a.data||'');});
  lista.forEach(function(r){
    var itens=r.itens||[];
    var ok=itens.filter(function(i){return i.status==='ok';}).length;
    var nok=itens.filter(function(i){return i.status==='nok';}).length;
    var pct=itens.length>0?Math.round((ok/itens.length)*100):0;
    var div=document.createElement('div');
    div.className='check-card';
    var itensHtml=itens.length>0?itens.map(function(i){
      var sc=i.status==='ok'?'status-ok':i.status==='nok'?'status-nok':i.status==='na'?'status-na':'status-pend';
      var si=i.status==='ok'?'✓':i.status==='nok'?'✗':i.status==='na'?'—':'?';
      return '<div class="check-item-row"><div class="check-item-status '+sc+'">'+si+'</div><span>'+(i.desc||'--')+'</span></div>';
    }).join(''):'<p style="font-size:.78rem;color:rgba(255,255,255,.25);text-align:center;padding:8px">Sem itens</p>';
    div.innerHTML=
      '<div class="check-card-top">'+
        '<div class="check-titulo">'+(r.titulo||'--')+'</div>'+
        '<span class="badge '+(r.status||'pendente')+'">'+(r.status||'pendente')+'</span>'+
      '</div>'+
      '<div class="check-info">'+
        '<span>📅 '+fmt(r.data)+'</span>'+
        '<span>👤 '+(r.responsavel||'--')+'</span>'+
        '<span>🏭 '+(r.local||'--')+'</span>'+
        '<span>✅ '+ok+' OK  ❌ '+nok+' NOK</span>'+
      '</div>'+
      '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="check-itens-wrap">'+itensHtml+'</div>'+
      '<div class="check-acoes">'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️ Editar</button>'+
        '<button class="btn-acao" onclick="excluir('+r.id+')" style="color:rgba(248,113,113,.7)">🗑️</button>'+
      '</div>';
    grid.appendChild(div);
  });
}
var itemCount=0;
function addItem(desc,status){
  desc=desc||'';status=status||'pendente';
  var id='item_'+Date.now()+'_'+(itemCount++);
  var div=document.createElement('div');
  div.className='item-editor-row';div.id=id;
  div.innerHTML=
    '<input type="text" placeholder="Descrição do item..." value="'+desc.replace(/"/g,'&quot;')+'"/>'+
    '<select>'+
      '<option value="pendente"'+(status==='pendente'?' selected':'')+'>⏳ Pendente</option>'+
      '<option value="ok"'+(status==='ok'?' selected':'')+'>✅ OK</option>'+
      '<option value="nok"'+(status==='nok'?' selected':'')+'>❌ NOK</option>'+
      '<option value="na"'+(status==='na'?' selected':'')+'>— N/A</option>'+
    '</select>'+
    '<button class="btn-rem-item" onclick="document.getElementById(\''+id+'\').remove()">✕</button>';
  document.getElementById('itensEditor').appendChild(div);
}
function getItens(){
  return Array.prototype.slice.call(document.querySelectorAll('#itensEditor .item-editor-row')).map(function(row){
    return{desc:row.querySelector('input').value.trim(),status:row.querySelector('select').value};
  }).filter(function(i){return i.desc;});
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'📋 Novo')+' Checklist';
  ['f_titulo','f_resp','f_local'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_data').value='';document.getElementById('f_status').value='pendente';
  document.getElementById('itensEditor').innerHTML='';itemCount=0;
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_titulo').value=r.titulo||'';document.getElementById('f_resp').value=r.responsavel||'';
    document.getElementById('f_data').value=r.data||'';document.getElementById('f_local').value=r.local||'';
    document.getElementById('f_status').value=r.status||'pendente';
    (r.itens||[]).forEach(function(i){addItem(i.desc,i.status);});
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  } else {
    for(var i=0;i<3;i++) addItem();
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var titulo=document.getElementById('f_titulo').value.trim();
  var data=document.getElementById('f_data').value;
  if(!titulo||!data){alert('Preencha Título e Data.');return;}
  var dados={titulo:titulo,responsavel:document.getElementById('f_resp').value.trim(),data:data,local:document.getElementById('f_local').value.trim(),status:document.getElementById('f_status').value,itens:getItens()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir este checklist?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
renderizar(getLista());
</script>
</body>
</html>
