<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Registro de Fotos</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#f472b6,#db2777);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(244,114,182,.12);border-color:#f472b6;color:#f472b6}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#f472b6}
    .fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .foto-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;transition:all .2s}
    .foto-card:hover{transform:translateY(-2px);border-color:rgba(244,114,182,.3)}
    .foto-thumb{width:100%;height:180px;object-fit:cover;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer}
    .foto-thumb img{width:100%;height:100%;object-fit:cover}
    .foto-info{padding:14px}
    .foto-titulo{font-size:.88rem;font-weight:700;margin-bottom:6px}
    .foto-meta{font-size:.75rem;color:rgba(255,255,255,.4);display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
    .badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
    .badge.inspecao{background:rgba(0,212,255,.12);color:#00d4ff}
    .badge.ocorrencia{background:rgba(248,113,113,.12);color:#f87171}
    .badge.risco{background:rgba(251,146,60,.12);color:#fb923c}
    .badge.melhoria{background:rgba(74,222,128,.12);color:#4ade80}
    .badge.geral{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .foto-acoes{display:flex;gap:8px;justify-content:flex-end}
    .btn-acao{background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:6px 10px;font-size:.8rem;color:rgba(255,255,255,.6);transition:all .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#f472b6}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:70px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .upload-area{border:2px dashed rgba(244,114,182,.3);border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
    .upload-area:hover{border-color:#f472b6;background:rgba(244,114,182,.05)}
    .upload-area p{font-size:.82rem;color:rgba(255,255,255,.4);margin-top:8px}
    .upload-area span{font-size:2rem}
    .preview-img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-top:10px}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#f472b6,#db2777);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2000;align-items:center;justify-content:center}
    .lightbox.open{display:flex}
    .lightbox img{max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain}
    .lightbox-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:44px;height:44px;font-size:1.2rem;color:#fff;cursor:pointer;transition:all .2s}
    .lightbox-close:hover{background:rgba(255,255,255,.2)}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>📸 Registro de Fotos</h2><span id="totalRegistros">0 fotos</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Adicionar Foto</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-total" style="color:#f472b6">0</div>
      <div class="rc-label">Total de Fotos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-inspecao" style="color:#00d4ff">0</div>
      <div class="rc-label">Inspeções</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-ocorrencia" style="color:#f87171">0</div>
      <div class="rc-label">Ocorrências</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-risco" style="color:#fb923c">0</div>
      <div class="rc-label">Riscos</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"   onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-insp"    onclick="filtrar('inspecao',this)">🔍 Inspeções</button>
    <button class="filtro-btn" id="fb-ocorr"   onclick="filtrar('ocorrencia',this)">🚨 Ocorrências</button>
    <button class="filtro-btn" id="fb-risco"   onclick="filtrar('risco',this)">⚠️ Riscos</button>
    <button class="filtro-btn" id="fb-melhoria" onclick="filtrar('melhoria',this)">✅ Melhorias</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar foto..." oninput="renderizar(getLista())"/>
  </div>
  <div class="fotos-grid" id="fotosGrid"></div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">📸 Adicionar Foto</h3>
    <div class="upload-area" onclick="document.getElementById('f_file').click()">
      <span>📷</span>
      <p>Clique para selecionar imagem ou cole a URL abaixo</p>
      <input type="file" id="f_file" accept="image/*" style="display:none" onchange="previewFile(this)"/>
      <img id="previewImagem" class="preview-img" style="display:none"/>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>URL da Imagem (alternativo)</label>
        <input type="text" id="f_url" placeholder="https://... ou caminho local" oninput="previewUrl(this.value)"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Título / Descrição *</label>
        <input type="text" id="f_titulo" placeholder="Ex: Condição insegura — Linha 3"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Categoria</label>
        <select id="f_cat">
          <option value="inspecao">Inspeção</option>
          <option value="ocorrencia">Ocorrência</option>
          <option value="risco">Risco</option>
          <option value="melhoria">Melhoria</option>
          <option value="geral">Geral</option>
        </select>
      </div>
      <div class="form-group">
        <label>Data do Registro</label>
        <input type="date" id="f_data"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Local / Setor</label>
        <input type="text" id="f_local" placeholder="Ex: Almoxarifado, Linha 2"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observações</label>
        <textarea id="f_obs" placeholder="Detalhes adicionais..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="fecharLightbox()">✕</button>
  <img id="lightboxImg" src="" alt=""/>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_fotos')||'[]');
var editandoId=null,filtroAtivo='',imgBase64='';
function salvarStorage(){localStorage.setItem('safenr_fotos',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function previewFile(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    imgBase64=e.target.result;
    var img=document.getElementById('previewImagem');
    img.src=imgBase64;img.style.display='block';
  };
  reader.readAsDataURL(input.files[0]);
}
function previewUrl(url){
  if(!url)return;
  var img=document.getElementById('previewImagem');
  img.src=url;img.style.display='block';
  imgBase64='';
}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    if(filtroAtivo&&r.categoria!==filtroAtivo)return false;
    if(busca&&!(r.titulo||'').toLowerCase().includes(busca)&&!(r.local||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function atualizarContadores(){
  document.getElementById('cnt-total').textContent=registros.length;
  document.getElementById('cnt-inspecao').textContent=registros.filter(function(r){return r.categoria==='inspecao';}).length;
  document.getElementById('cnt-ocorrencia').textContent=registros.filter(function(r){return r.categoria==='ocorrencia';}).length;
  document.getElementById('cnt-risco').textContent=registros.filter(function(r){return r.categoria==='risco';}).length;
  document.getElementById('totalRegistros').textContent=registros.length+' foto(s)';
}
function renderizar(lista){
  var grid=document.getElementById('fotosGrid');
  grid.innerHTML='';atualizarContadores();
  if(lista.length===0){grid.innerHTML='<div class="empty-state"><div>📸</div><p>Nenhuma foto encontrada.<br>Clique em <strong>+ Adicionar Foto</strong>.</p></div>';return;}
  lista.sort(function(a,b){return new Date(b.registradoEm)-new Date(a.registradoEm);});
  lista.forEach(function(r){
    var temImagem=r.imagem||r.url;
    var div=document.createElement('div');
    div.className='foto-card';
    div.innerHTML=
      '<div class="foto-thumb" onclick="abrirLightbox(\''+( temImagem||'').replace(/'/g,"\\'")+'\')">'+(temImagem?'<img src="'+temImagem+'" alt="'+r.titulo+'" onerror="this.parentElement.innerHTML=\'📷\'"/>':'📷')+'</div>'+
      '<div class="foto-info">'+
        '<div class="foto-titulo">'+(r.titulo||'--')+'</div>'+
        '<div class="foto-meta">'+
          '<span>📅 '+fmt(r.data)+'</span>'+
          '<span>🏭 '+(r.local||'--')+'</span>'+
          '<span>👤 '+(r.registradoPor||'--')+'</span>'+
        '</div>'+
        '<div style="margin-bottom:10px"><span class="badge '+(r.categoria||'geral')+'">'+(r.categoria||'geral')+'</span></div>'+
        '<div class="foto-acoes">'+
          (temImagem?'<button class="btn-acao" onclick="abrirLightbox(\''+temImagem.replace(/'/g,"\\'")+'\')" title="Ver em tela cheia">🔍</button>':'')+
          '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️</button>'+
          '<button class="btn-acao" onclick="excluir('+r.id+')" style="color:rgba(248,113,113,.7)">🗑️</button>'+
        '</div>'+
      '</div>';
    grid.appendChild(div);
  });
}
function abrirModal(id){
  editandoId=id||null;imgBase64='';
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'📸 Adicionar')+' Foto';
  ['f_url','f_titulo','f_local','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_data').value='';document.getElementById('f_cat').value='inspecao';
  document.getElementById('previewImagem').style.display='none';document.getElementById('f_file').value='';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_titulo').value=r.titulo||'';document.getElementById('f_cat').value=r.categoria||'inspecao';
    document.getElementById('f_data').value=r.data||'';document.getElementById('f_local').value=r.local||'';
    document.getElementById('f_obs').value=r.obs||'';document.getElementById('f_url').value=r.url||'';
    if(r.imagem||r.url){var img=document.getElementById('previewImagem');img.src=r.imagem||r.url;img.style.display='block';}
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;imgBase64='';}
function salvar(){
  var titulo=document.getElementById('f_titulo').value.trim();
  if(!titulo){alert('Preencha o Título.');return;}
  var url=document.getElementById('f_url').value.trim();
  var dados={titulo:titulo,categoria:document.getElementById('f_cat').value,data:document.getElementById('f_data').value,local:document.getElementById('f_local').value.trim(),obs:document.getElementById('f_obs').value.trim(),imagem:imgBase64||'',url:imgBase64?'':url};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir esta foto?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function abrirLightbox(src){if(!src)return;document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');}
function fecharLightbox(){document.getElementById('lightbox').classList.remove('open');}
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)fecharLightbox();});
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
renderizar(getLista());
</script>
</body>
</html>
