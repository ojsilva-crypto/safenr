<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Inspeções</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
    .resumo-card:hover{background:rgba(255,255,255,.06)}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(0,212,255,.12);border-color:#00d4ff;color:#00d4ff}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#00d4ff}
    .tabela-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead tr{background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
    th{padding:14px 18px;text-align:left;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.5px}
    td{padding:14px 18px;font-size:.87rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
    .badge.pendente{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.concluida{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.em-andamento{background:rgba(96,165,250,.15);color:#60a5fa}
    .badge.cancelada{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .badge.rotina{background:rgba(0,212,255,.12);color:#00d4ff}
    .badge.extraordinaria{background:rgba(251,146,60,.12);color:#fb923c}
    .badge.auditoria{background:rgba(167,139,250,.12);color:#a78bfa}
    .badge.followup{background:rgba(52,211,153,.12);color:#34d399}
    .btn-acao{background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:.85rem;transition:background .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08)}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#00d4ff}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:70px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .secao-titulo{font-size:.78rem;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(0,212,255,.15)}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .detalhe-row{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .detalhe-row:last-child{border-bottom:none}
    .detalhe-label{font-size:.78rem;color:rgba(255,255,255,.4);min-width:160px;font-weight:600}
    .detalhe-valor{font-size:.88rem;color:#fff;flex:1}
    .pontuacao-box{text-align:center;padding:16px;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.08);margin-bottom:16px}
    .pontuacao-valor{font-size:2.5rem;font-weight:900}
    .pontuacao-label{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:4px}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>🔍 Inspeções de Segurança</h2><span id="totalRegistros">0 registros</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Nova Inspeção</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card" onclick="filtrar('pendente',document.getElementById('fb-pend'))">
      <div class="rc-valor" id="cnt-pendente" style="color:#fbbf24">0</div>
      <div class="rc-label">Pendentes</div>
    </div>
    <div class="resumo-card" onclick="filtrar('em-andamento',document.getElementById('fb-and'))">
      <div class="rc-valor" id="cnt-andamento" style="color:#60a5fa">0</div>
      <div class="rc-label">Em Andamento</div>
    </div>
    <div class="resumo-card" onclick="filtrar('concluida',document.getElementById('fb-conc'))">
      <div class="rc-valor" id="cnt-concluida" style="color:#4ade80">0</div>
      <div class="rc-label">Concluidas</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-media" style="color:#00d4ff">--</div>
      <div class="rc-label">Media Pontuacao</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"  onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-pend"  onclick="filtrar('pendente',this)">🟡 Pendentes</button>
    <button class="filtro-btn" id="fb-and"   onclick="filtrar('em-andamento',this)">🔵 Em Andamento</button>
    <button class="filtro-btn" id="fb-conc"  onclick="filtrar('concluida',this)">✅ Concluidas</button>
    <button class="filtro-btn" id="fb-canc"  onclick="filtrar('cancelada',this)">❌ Canceladas</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar inspeção..." oninput="renderizar(getLista())"/>
  </div>
  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Titulo</th><th>Tipo</th><th>Local / Setor</th><th>Responsavel</th>
          <th>Data</th><th>Status</th><th>Pontuacao</th><th>Registrado por</th><th>Acoes</th>
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <div>🔍</div>
      <p>Nenhuma inspeção cadastrada.<br>Clique em <strong>+ Nova Inspeção</strong>.</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">🔍 Nova Inspeção</h3>
    <div class="secao-titulo">Identificação</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Titulo da Inspeção *</label>
        <input type="text" id="f_titulo" placeholder="Ex: Inspeção de EPIs — Producao"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo *</label>
        <select id="f_tipo">
          <option value="rotina">Rotina</option>
          <option value="extraordinaria">Extraordinaria</option>
          <option value="auditoria">Auditoria</option>
          <option value="followup">Follow-up</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status *</label>
        <select id="f_status">
          <option value="pendente">Pendente</option>
          <option value="em-andamento">Em Andamento</option>
          <option value="concluida">Concluida</option>
          <option value="cancelada">Cancelada</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Local / Setor *</label>
        <input type="text" id="f_local" placeholder="Ex: Almoxarifado, Linha 3"/>
      </div>
      <div class="form-group">
        <label>Responsavel</label>
        <input type="text" id="f_resp" placeholder="Nome do responsavel"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data da Inspeção *</label>
        <input type="date" id="f_data"/>
      </div>
      <div class="form-group">
        <label>Pontuacao (0–100)</label>
        <input type="number" id="f_pont" min="0" max="100" placeholder="Ex: 85"/>
      </div>
    </div>
    <div class="secao-titulo">Detalhes</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Conformidades Encontradas</label>
        <textarea id="f_conf" placeholder="Descreva os itens conformes..."></textarea>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Nao Conformidades / Desvios</label>
        <textarea id="f_ncf" placeholder="Descreva as nao conformidades..."></textarea>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Acoes Recomendadas</label>
        <textarea id="f_acao" placeholder="Acoes corretivas sugeridas..."></textarea>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observacoes Gerais</label>
        <textarea id="f_obs" placeholder="Observacoes adicionais..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalVer">
  <div class="modal">
    <h3>🔍 Detalhes da Inspeção</h3>
    <div id="modalVerConteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharVer()">Fechar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_inspecoes')||'[]');
var editandoId=null,filtroAtivo='';
function salvarStorage(){localStorage.setItem('safenr_inspecoes',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    if(filtroAtivo&&r.status!==filtroAtivo)return false;
    if(busca&&!(r.titulo||'').toLowerCase().includes(busca)&&!(r.local||'').toLowerCase().includes(busca)&&!(r.responsavel||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function pontuacaoCor(p){if(p===null||p===undefined||p==='')return '#fff';if(p>=80)return '#4ade80';if(p>=60)return '#fbbf24';return '#f87171';}
function atualizarContadores(){
  document.getElementById('cnt-pendente').textContent=registros.filter(function(r){return r.status==='pendente';}).length;
  document.getElementById('cnt-andamento').textContent=registros.filter(function(r){return r.status==='em-andamento';}).length;
  document.getElementById('cnt-concluida').textContent=registros.filter(function(r){return r.status==='concluida';}).length;
  var comPont=registros.filter(function(r){return r.pontuacao!==''&&r.pontuacao!==null&&r.pontuacao!==undefined;});
  if(comPont.length>0){var media=Math.round(comPont.reduce(function(a,r){return a+parseFloat(r.pontuacao);},0)/comPont.length);document.getElementById('cnt-media').textContent=media+'%';}
  else document.getElementById('cnt-media').textContent='--';
  document.getElementById('totalRegistros').textContent=registros.length+' registro(s)';
}
function renderizar(lista){
  var tbody=document.getElementById('tabelaBody');
  var empty=document.getElementById('emptyState');
  tbody.innerHTML='';atualizarContadores();
  if(lista.length===0){empty.style.display='block';return;}
  empty.style.display='none';
  lista.sort(function(a,b){return (b.data||'').localeCompare(a.data||'');});
  lista.forEach(function(r){
    var tr=document.createElement('tr');
    var pCor=pontuacaoCor(r.pontuacao);
    tr.innerHTML=
      '<td style="color:rgba(255,255,255,.3);font-size:.8rem">#'+String(r.id).padStart(3,'0')+'</td>'+
      '<td><strong>'+(r.titulo||'--')+'</strong></td>'+
      '<td><span class="badge '+(r.tipo||'rotina')+'">'+(r.tipo||'--')+'</span></td>'+
      '<td>'+(r.local||'--')+'</td>'+
      '<td>'+(r.responsavel||'--')+'</td>'+
      '<td>'+fmt(r.data)+'</td>'+
      '<td><span class="badge '+(r.status||'pendente')+'">'+(r.status||'--')+'</span></td>'+
      '<td><strong style="color:'+pCor+'">'+(r.pontuacao!==''&&r.pontuacao!==null&&r.pontuacao!==undefined?r.pontuacao+'%':'--')+'</strong></td>'+
      '<td style="font-size:.82rem">👤 '+(r.registradoPor||'--')+'</td>'+
      '<td>'+
        '<button class="btn-acao" onclick="ver('+r.id+')">👁️</button>'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️</button>'+
        '<button class="btn-acao" onclick="excluir('+r.id+')">🗑️</button>'+
      '</td>';
    tbody.appendChild(tr);
  });
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'🔍 Nova')+' Inspeção';
  ['f_titulo','f_local','f_resp','f_pont','f_conf','f_ncf','f_acao','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_tipo').value='rotina';document.getElementById('f_status').value='pendente';document.getElementById('f_data').value='';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_titulo').value=r.titulo||'';document.getElementById('f_tipo').value=r.tipo||'rotina';
    document.getElementById('f_status').value=r.status||'pendente';document.getElementById('f_local').value=r.local||'';
    document.getElementById('f_resp').value=r.responsavel||'';document.getElementById('f_data').value=r.data||'';
    document.getElementById('f_pont').value=r.pontuacao!==undefined?r.pontuacao:'';
    document.getElementById('f_conf').value=r.conformidades||'';document.getElementById('f_ncf').value=r.naoConformidades||'';
    document.getElementById('f_acao').value=r.acoes||'';document.getElementById('f_obs').value=r.obs||'';
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var titulo=document.getElementById('f_titulo').value.trim();
  var local=document.getElementById('f_local').value.trim();
  var data=document.getElementById('f_data').value;
  if(!titulo||!local||!data){alert('Preencha: Titulo, Local e Data.');return;}
  var pont=document.getElementById('f_pont').value;
  var dados={titulo:titulo,tipo:document.getElementById('f_tipo').value,status:document.getElementById('f_status').value,local:local,responsavel:document.getElementById('f_resp').value.trim(),data:data,pontuacao:pont!==''?parseFloat(pont):'',conformidades:document.getElementById('f_conf').value.trim(),naoConformidades:document.getElementById('f_ncf').value.trim(),acoes:document.getElementById('f_acao').value.trim(),obs:document.getElementById('f_obs').value.trim()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir esta inspeção?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function ver(id){
  var r=registros.find(function(x){return x.id===id;});
  function row(l,v){return '<div class="detalhe-row"><span class="detalhe-label">'+l+'</span><span class="detalhe-valor">'+v+'</span></div>';}
  var pCor=pontuacaoCor(r.pontuacao);
  document.getElementById('modalVerConteudo').innerHTML=
    (r.pontuacao!==''&&r.pontuacao!==null&&r.pontuacao!==undefined?'<div class="pontuacao-box"><div class="pontuacao-valor" style="color:'+pCor+'">'+r.pontuacao+'%</div><div class="pontuacao-label">Pontuacao da Inspecao</div></div>':'')+
    row('Titulo',r.titulo||'--')+row('Tipo','<span class="badge '+(r.tipo||'rotina')+'">'+(r.tipo||'--')+'</span>')+
    row('Status','<span class="badge '+(r.status||'pendente')+'">'+(r.status||'--')+'</span>')+
    row('Local / Setor',r.local||'--')+row('Responsavel',r.responsavel||'--')+row('Data',fmt(r.data))+
    row('Conformidades',r.conformidades||'--')+row('Nao Conformidades',r.naoConformidades||'--')+
    row('Acoes Recomendadas',r.acoes||'--')+row('Observacoes',r.obs||'--')+
    row('Registrado por','<span style="color:#00d4ff">'+(r.registradoPor||'--')+'</span>')+
    row('Registrado em','<span style="color:#00d4ff">'+fmtDT(r.registradoEm)+'</span>');
  document.getElementById('modalVer').classList.add('open');
}
function fecharVer(){document.getElementById('modalVer').classList.remove('open');}
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.getElementById('modalVer').addEventListener('click',function(e){if(e.target===this)fecharVer();});
renderizar(getLista());
</script>
</body>
</html>
