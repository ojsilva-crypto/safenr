<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Documentos SST</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(167,139,250,.12);border-color:#a78bfa;color:#a78bfa}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#a78bfa}
    .docs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .doc-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;transition:all .2s}
    .doc-card:hover{background:rgba(255,255,255,.05);transform:translateY(-2px)}
    .doc-icone{font-size:2.2rem;margin-bottom:12px}
    .doc-nome{font-size:.9rem;font-weight:700;margin-bottom:6px}
    .doc-tipo{font-size:.75rem;color:rgba(255,255,255,.4);margin-bottom:10px}
    .doc-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
    .badge.valido{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.vencido{background:rgba(248,113,113,.15);color:#f87171}
    .badge.a-vencer{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.sem-validade{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .badge.pgr{background:rgba(0,212,255,.12);color:#00d4ff}
    .badge.pcmso{background:rgba(129,140,248,.12);color:#818cf8}
    .badge.laudo{background:rgba(167,139,250,.12);color:#a78bfa}
    .badge.procedimento{background:rgba(52,211,153,.12);color:#34d399}
    .badge.certificado{background:rgba(251,146,60,.12);color:#fb923c}
    .badge.outro{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .doc-acoes{display:flex;gap:8px;justify-content:flex-end}
    .btn-acao{background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:6px 12px;font-size:.8rem;color:rgba(255,255,255,.6);transition:all .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#a78bfa}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:70px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .secao-titulo{font-size:.78rem;font-weight:800;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(167,139,250,.15)}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .detalhe-row{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .detalhe-row:last-child{border-bottom:none}
    .detalhe-label{font-size:.78rem;color:rgba(255,255,255,.4);min-width:160px;font-weight:600}
    .detalhe-valor{font-size:.88rem;color:#fff;flex:1}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>🗂️ Documentos SST</h2><span id="totalRegistros">0 documentos</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo Documento</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-valido" style="color:#4ade80">0</div>
      <div class="rc-label">Válidos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-vencido" style="color:#f87171">0</div>
      <div class="rc-label">Vencidos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-avencer" style="color:#fbbf24">0</div>
      <div class="rc-label">Vencem em 30d</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-semval" style="color:rgba(255,255,255,.4)">0</div>
      <div class="rc-label">Sem Validade</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"  onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-pgr"   onclick="filtrar('pgr',this)">📋 PGR</button>
    <button class="filtro-btn" id="fb-pcmso" onclick="filtrar('pcmso',this)">🏥 PCMSO</button>
    <button class="filtro-btn" id="fb-laudo" onclick="filtrar('laudo',this)">📄 Laudos</button>
    <button class="filtro-btn" id="fb-proc"  onclick="filtrar('procedimento',this)">📝 Procedimentos</button>
    <button class="filtro-btn" id="fb-cert"  onclick="filtrar('certificado',this)">🏅 Certificados</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar documento..." oninput="renderizar(getLista())"/>
  </div>
  <div class="docs-grid" id="docsGrid"></div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">🗂️ Novo Documento</h3>
    <div class="secao-titulo">Identificação</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Nome do Documento *</label>
        <input type="text" id="f_nome" placeholder="Ex: PGR 2025 — Empresa XYZ"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo *</label>
        <select id="f_tipo">
          <option value="pgr">PGR</option>
          <option value="pcmso">PCMSO</option>
          <option value="laudo">Laudo Técnico</option>
          <option value="procedimento">Procedimento</option>
          <option value="certificado">Certificado</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Número / Revisão</label>
        <input type="text" id="f_numero" placeholder="Ex: Rev. 03 / 2025"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data de Emissão</label>
        <input type="date" id="f_emissao"/>
      </div>
      <div class="form-group">
        <label>Data de Validade</label>
        <input type="date" id="f_validade"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Responsável Técnico</label>
        <input type="text" id="f_resp" placeholder="Ex: Eng. João Silva — CREA 12345"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Link / Localização do Arquivo</label>
        <input type="text" id="f_link" placeholder="Ex: /documentos/pgr-2025.pdf"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observações</label>
        <textarea id="f_obs" placeholder="Informações adicionais..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalVer">
  <div class="modal">
    <h3>🗂️ Detalhes do Documento</h3>
    <div id="modalVerConteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharVer()">Fechar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_documentos')||'[]');
var editandoId=null,filtroAtivo='';
function salvarStorage(){localStorage.setItem('safenr_documentos',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function isVencido(d){return d&&new Date(d+'T00:00:00')<new Date();}
function venceEm30(d){if(!d)return false;var diff=(new Date(d+'T00:00:00')-new Date())/86400000;return diff>=0&&diff<=30;}
function getValStatus(d){if(!d)return{cls:'sem-validade',label:'Sem Validade'};if(isVencido(d))return{cls:'vencido',label:'Vencido'};if(venceEm30(d))return{cls:'a-vencer',label:'A Vencer'};return{cls:'valido',label:'Válido'};}
var docIcones={pgr:'📋',pcmso:'🏥',laudo:'📄',procedimento:'📝',certificado:'🏅',outro:'🗂️'};
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    if(filtroAtivo&&r.tipo!==filtroAtivo)return false;
    if(busca&&!(r.nome||'').toLowerCase().includes(busca)&&!(r.responsavel||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function atualizarContadores(){
  document.getElementById('cnt-valido').textContent=registros.filter(function(r){return getValStatus(r.validade).cls==='valido';}).length;
  document.getElementById('cnt-vencido').textContent=registros.filter(function(r){return isVencido(r.validade);}).length;
  document.getElementById('cnt-avencer').textContent=registros.filter(function(r){return venceEm30(r.validade)&&!isVencido(r.validade);}).length;
  document.getElementById('cnt-semval').textContent=registros.filter(function(r){return !r.validade;}).length;
  document.getElementById('totalRegistros').textContent=registros.length+' documento(s)';
}
function renderizar(lista){
  var grid=document.getElementById('docsGrid');
  grid.innerHTML='';atualizarContadores();
  if(lista.length===0){grid.innerHTML='<div class="empty-state"><div>🗂️</div><p>Nenhum documento encontrado.<br>Clique em <strong>+ Novo Documento</strong>.</p></div>';return;}
  lista.forEach(function(r){
    var vs=getValStatus(r.validade);
    var div=document.createElement('div');
    div.className='doc-card';
    div.innerHTML=
      '<div class="doc-icone">'+(docIcones[r.tipo]||'🗂️')+'</div>'+
      '<div class="doc-nome">'+(r.nome||'--')+'</div>'+
      '<div class="doc-tipo">'+(r.numero||'')+'</div>'+
      '<div class="doc-meta">'+
        '<span class="badge '+(r.tipo||'outro')+'">'+(r.tipo||'outro').toUpperCase()+'</span>'+
        '<span class="badge '+vs.cls+'">'+vs.label+'</span>'+
      '</div>'+
      '<div style="font-size:.75rem;color:rgba(255,255,255,.35);margin-bottom:12px">'+
        '📅 Emissão: '+fmt(r.emissao)+(r.validade?' · Validade: '+fmt(r.validade):'')+
        (r.responsavel?'<br>👤 '+r.responsavel:'')+'</div>'+
      '<div class="doc-acoes">'+
        (r.link?'<button class="btn-acao" onclick="window.open(\''+r.link+'\',\'_blank\')">🔗 Abrir</button>':'')+
        '<button class="btn-acao" onclick="ver('+r.id+')">👁️ Ver</button>'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️</button>'+
        '<button class="btn-acao" onclick="excluir('+r.id+')" style="color:rgba(248,113,113,.7)">🗑️</button>'+
      '</div>';
    grid.appendChild(div);
  });
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'🗂️ Novo')+' Documento';
  ['f_nome','f_numero','f_resp','f_link','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_emissao').value='';document.getElementById('f_validade').value='';
  document.getElementById('f_tipo').value='pgr';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_nome').value=r.nome||'';document.getElementById('f_tipo').value=r.tipo||'pgr';
    document.getElementById('f_numero').value=r.numero||'';document.getElementById('f_emissao').value=r.emissao||'';
    document.getElementById('f_validade').value=r.validade||'';document.getElementById('f_resp').value=r.responsavel||'';
    document.getElementById('f_link').value=r.link||'';document.getElementById('f_obs').value=r.obs||'';
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var nome=document.getElementById('f_nome').value.trim();
  if(!nome){alert('Preencha o Nome do Documento.');return;}
  var dados={nome:nome,tipo:document.getElementById('f_tipo').value,numero:document.getElementById('f_numero').value.trim(),emissao:document.getElementById('f_emissao').value,validade:document.getElementById('f_validade').value,responsavel:document.getElementById('f_resp').value.trim(),link:document.getElementById('f_link').value.trim(),obs:document.getElementById('f_obs').value.trim()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir este documento?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function ver(id){
  var r=registros.find(function(x){return x.id===id;});
  var vs=getValStatus(r.validade);
  function row(l,v){return '<div class="detalhe-row"><span class="detalhe-label">'+l+'</span><span class="detalhe-valor">'+v+'</span></div>';}
  document.getElementById('modalVerConteudo').innerHTML=
    row('Nome',r.nome||'--')+row('Tipo','<span class="badge '+(r.tipo||'outro')+'">'+(r.tipo||'--').toUpperCase()+'</span>')+
    row('Número / Revisão',r.numero||'--')+row('Data de Emissão',fmt(r.emissao))+
    row('Data de Validade',r.validade?'<span style="color:'+(vs.cls==='vencido'?'#f87171':'#4ade80')+'">'+fmt(r.validade)+'</span>':'--')+
    row('Status Validade','<span class="badge '+vs.cls+'">'+vs.label+'</span>')+
    row('Responsável Técnico',r.responsavel||'--')+
    row('Link / Arquivo',r.link?'<a href="'+r.link+'" target="_blank" style="color:#a78bfa">🔗 Abrir arquivo</a>':'--')+
    row('Observações',r.obs||'--')+
    row('Registrado por','<span style="color:#00d4ff">'+(r.registradoPor||'--')+'</span>')+
    row('Registrado em','<span style="color:#00d4ff">'+fmtDT(r.registradoEm)+'</span>');
  document.getElementById('modalVer').classList.add('open');
}
function fecharVer(){document.getElementById('modalVer').classList.remove('open');}
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.getElementById('modalVer').addEventListener('click',function(e){if(e.target===this)fecharVer();});
renderizar(getLista());
</script>
</body>
</html>
