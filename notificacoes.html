<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Notificações</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar-acoes{display:flex;gap:10px}
    .btn-acao-top{padding:10px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:.85rem;transition:all .2s}
    .btn-acao-top:hover{background:rgba(255,255,255,.08);color:#fff}
    .btn-gerar{background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;border-radius:10px;color:#fff;font-size:.85rem;font-weight:700;padding:10px 20px;cursor:pointer}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(0,212,255,.12);border-color:#00d4ff;color:#00d4ff}
    .notif-lista{display:flex;flex-direction:column;gap:8px}
    .notif-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 22px;display:flex;align-items:flex-start;gap:14px;transition:all .2s;cursor:pointer}
    .notif-item:hover{background:rgba(255,255,255,.05)}
    .notif-item.nao-lida{border-left:4px solid #00d4ff;background:rgba(0,212,255,.04)}
    .notif-item.lida{opacity:.6}
    .notif-icone{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
    .ni-vermelho{background:rgba(248,113,113,.15)}
    .ni-amarelo{background:rgba(251,191,36,.15)}
    .ni-azul{background:rgba(0,212,255,.15)}
    .ni-verde{background:rgba(74,222,128,.15)}
    .ni-roxo{background:rgba(167,139,250,.15)}
    .notif-corpo{flex:1}
    .notif-titulo{font-size:.9rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
    .notif-dot{width:8px;height:8px;border-radius:50%;background:#00d4ff;flex-shrink:0}
    .notif-desc{font-size:.78rem;color:rgba(255,255,255,.5);line-height:1.5;margin-bottom:6px}
    .notif-meta{font-size:.72rem;color:rgba(255,255,255,.25);display:flex;gap:12px}
    .badge{padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700}
    .badge.critico{background:rgba(248,113,113,.2);color:#f87171}
    .badge.aviso{background:rgba(251,191,36,.2);color:#fbbf24}
    .badge.info{background:rgba(0,212,255,.15);color:#00d4ff}
    .badge.sucesso{background:rgba(74,222,128,.15);color:#4ade80}
    .notif-acoes{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
    .btn-notif{background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:.8rem;color:rgba(255,255,255,.4);transition:all .2s;white-space:nowrap}
    .btn-notif:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
    .empty-state div{font-size:3rem;margin-bottom:12px}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>🔔 Notificações</h2></div>
    <div class="topbar-acoes">
      <button class="btn-acao-top" onclick="marcarTodasLidas()">✅ Marcar todas como lidas</button>
      <button class="btn-acao-top" onclick="limparLidas()">🗑️ Limpar lidas</button>
      <button class="btn-gerar" onclick="gerarAutomaticas()">🔄 Verificar alertas</button>
    </div>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-nao-lidas" style="color:#00d4ff">0</div>
      <div class="rc-label">Não Lidas</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-critico" style="color:#f87171">0</div>
      <div class="rc-label">Críticas</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-aviso" style="color:#fbbf24">0</div>
      <div class="rc-label">Avisos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-total" style="color:rgba(255,255,255,.5)">0</div>
      <div class="rc-label">Total</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todas"    onclick="filtrar('todas',this)">Todas</button>
    <button class="filtro-btn" id="fb-nao-lidas" onclick="filtrar('nao-lidas',this)">🔵 Não Lidas</button>
    <button class="filtro-btn" id="fb-critico"   onclick="filtrar('critico',this)">🔴 Críticas</button>
    <button class="filtro-btn" id="fb-aviso"     onclick="filtrar('aviso',this)">🟡 Avisos</button>
    <button class="filtro-btn" id="fb-info"      onclick="filtrar('info',this)">🔵 Info</button>
  </div>
  <div class="notif-lista" id="notifLista"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div>🔔</div>
    <p>Nenhuma notificação encontrada.<br>Clique em <strong>Verificar alertas</strong> para gerar automaticamente.</p>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var notifs=JSON.parse(localStorage.getItem('safenr_notificacoes')||'[]');
var filtroAtivo='todas';
function salvar(){localStorage.setItem('safenr_notificacoes',JSON.stringify(notifs));}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function tempoRelativo(iso){
  if(!iso)return '';
  var diff=Math.round((new Date()-new Date(iso))/60000);
  if(diff<1)return 'Agora';if(diff<60)return diff+'min atrás';
  var h=Math.round(diff/60);if(h<24)return h+'h atrás';
  var d=Math.round(h/24);return d+' dia(s) atrás';
}
function getLista(){
  return notifs.filter(function(n){
    if(filtroAtivo==='nao-lidas')return !n.lida;
    if(filtroAtivo==='critico')return n.tipo==='critico';
    if(filtroAtivo==='aviso')return n.tipo==='aviso';
    if(filtroAtivo==='info')return n.tipo==='info';
    return true;
  }).sort(function(a,b){return new Date(b.criadoEm)-new Date(a.criadoEm);});
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar();}
function atualizarContadores(){
  document.getElementById('cnt-nao-lidas').textContent=notifs.filter(function(n){return !n.lida;}).length;
  document.getElementById('cnt-critico').textContent=notifs.filter(function(n){return n.tipo==='critico';}).length;
  document.getElementById('cnt-aviso').textContent=notifs.filter(function(n){return n.tipo==='aviso';}).length;
  document.getElementById('cnt-total').textContent=notifs.length;
}
var iconeMap={critico:'🚨',aviso:'⚠️',info:'ℹ️',sucesso:'✅'};
var corMap={critico:'ni-vermelho',aviso:'ni-amarelo',info:'ni-azul',sucesso:'ni-verde'};
function renderizar(){
  var lista=getLista();
  var cont=document.getElementById('notifLista');
  var empty=document.getElementById('emptyState');
  cont.innerHTML='';atualizarContadores();
  if(lista.length===0){empty.style.display='block';return;}
  empty.style.display='none';
  lista.forEach(function(n){
    var div=document.createElement('div');
    div.className='notif-item'+(n.lida?' lida':' nao-lida');
    div.innerHTML=
      '<div class="notif-icone '+(corMap[n.tipo]||'ni-azul')+'">'+(iconeMap[n.tipo]||'🔔')+'</div>'+
      '<div class="notif-corpo">'+
        '<div class="notif-titulo">'+(!n.lida?'<div class="notif-dot"></div>':'')+n.titulo+'<span class="badge '+(n.tipo||'info')+'">'+(n.tipo||'info')+'</span></div>'+
        '<div class="notif-desc">'+(n.descricao||'')+'</div>'+
        '<div class="notif-meta"><span>🕐 '+tempoRelativo(n.criadoEm)+'</span><span>'+fmtDT(n.criadoEm)+'</span>'+(n.modulo?'<span>📂 '+n.modulo+'</span>':'')+'</div>'+
      '</div>'+
      '<div class="notif-acoes">'+
        (!n.lida?'<button class="btn-notif" onclick="marcarLida('+n.id+',event)">✓ Lida</button>':'')+
        '<button class="btn-notif" onclick="excluir('+n.id+',event)" style="color:rgba(248,113,113,.6)">🗑️</button>'+
      '</div>';
    div.onclick=function(){marcarLida(n.id);};
    cont.appendChild(div);
  });
}
function marcarLida(id,e){if(e)e.stopPropagation();var n=notifs.find(function(x){return x.id===id;});if(n)n.lida=true;salvar();renderizar();}
function excluir(id,e){if(e)e.stopPropagation();notifs=notifs.filter(function(n){return n.id!==id;});salvar();renderizar();}
function marcarTodasLidas(){notifs.forEach(function(n){n.lida=true;});salvar();renderizar();}
function limparLidas(){notifs=notifs.filter(function(n){return !n.lida;});salvar();renderizar();}
function gerarAutomaticas(){
  var novas=[];
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var treins=JSON.parse(localStorage.getItem('safenr_treinamentos')||'[]');
  treins.forEach(function(t){
    if(!t.dataVal)return;
    var d=new Date(t.dataVal+'T00:00:00');
    var diff=Math.round((d-hoje)/86400000);
    var chave='trein_val_'+t.id;
    if(notifs.find(function(n){return n.chave===chave;}))return;
    if(diff<0)novas.push({chave:chave,titulo:'Certificado vencido: '+t.nome,descricao:'O certificado do treinamento venceu há '+Math.abs(diff)+' dia(s). Agende a reciclagem.',tipo:'critico',modulo:'Treinamentos'});
    else if(diff<=30)novas.push({chave:chave,titulo:'Certificado vence em breve: '+t.nome,descricao:'O certificado vence em '+diff+' dia(s).',tipo:'aviso',modulo:'Treinamentos'});
  });
  var riscos=JSON.parse(localStorage.getItem('safenr_riscos')||'[]');
  riscos.filter(function(r){return r.nivel==='critico'&&!r.medida;}).forEach(function(r){
    var chave='risco_sem_ctrl_'+r.id;
    if(notifs.find(function(n){return n.chave===chave;}))return;
    novas.push({chave:chave,titulo:'Risco crítico sem controle: '+r.descricao,descricao:'Setor: '+(r.setor||'--')+'. Defina uma medida de controle imediatamente.',tipo:'critico',modulo:'Riscos'});
  });
  var planos=JSON.parse(localStorage.getItem('safenr_planos')||'[]');
  planos.forEach(function(p){
    if(p.status==='concluido'||p.status==='cancelado')return;
    if(!p.quando)return;
    var d=new Date(p.quando+'T00:00:00');
    if(d<hoje){
      var chave='plano_atr_'+p.id;
      if(notifs.find(function(n){return n.chave===chave;}))return;
      novas.push({chave:chave,titulo:'Plano de ação atrasado: '+p.oque,descricao:'Responsável: '+(p.quem||'--')+'. Prazo venceu em '+p.quando+'.',tipo:'critico',modulo:'Plano de Ação'});
    }
  });
  if(novas.length===0){alert('Nenhum novo alerta encontrado.');return;}
  var maxId=notifs.length>0?Math.max.apply(null,notifs.map(function(n){return n.id||0;})):0;
  novas.forEach(function(n,i){notifs.push(Object.assign({id:maxId+i+1,lida:false,criadoEm:new Date().toISOString()},n));});
  salvar();renderizar();
  alert('✅ '+novas.length+' novo(s) alerta(s) gerado(s)!');
}
renderizar();
</script>
</body>
</html>
