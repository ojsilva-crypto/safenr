<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda - Calendário de Pendências</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 10px;
      color: #c9d6ff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      color: #a0aec0;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    /* ===== NAVEGAÇÃO DO MÊS ===== */
    .nav-mes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .nav-mes button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s;
    }

    .nav-mes button:hover {
      background: rgba(99,102,241,0.5);
      border-color: #6366f1;
    }

    #titulo-mes {
      font-size: 1.4rem;
      font-weight: bold;
      color: #c9d6ff;
      min-width: 220px;
      text-align: center;
    }

    /* ===== CALENDÁRIO ===== */
    .calendario-container {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      max-width: 1000px;
      margin: 0 auto 30px auto;
    }

    .dias-semana {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .dias-semana div {
      text-align: center;
      font-weight: bold;
      color: #6366f1;
      font-size: 0.85rem;
      padding: 8px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dia-celula {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      min-height: 100px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .dia-celula:hover {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      transform: translateY(-2px);
    }

    .dia-celula.outro-mes {
      opacity: 0.3;
    }

    .dia-celula.hoje {
      background: rgba(99,102,241,0.25);
      border: 2px solid #6366f1;
      box-shadow: 0 0 15px rgba(99,102,241,0.3);
    }

    .dia-celula.tem-pendencia {
      border-color: #f59e0b;
      box-shadow: 0 0 8px rgba(245,158,11,0.3);
    }

    .numero-dia {
      font-weight: bold;
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 5px;
    }

    .hoje .numero-dia {
      color: #6366f1;
      font-size: 1.1rem;
    }

    .badge-pendencias {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-size: 0.65rem;
      font-weight: bold;
      border-radius: 20px;
      padding: 1px 6px;
      margin-bottom: 4px;
      width: fit-content;
    }

    .pendencia-mini {
      font-size: 0.65rem;
      color: #fbbf24;
      background: rgba(245,158,11,0.15);
      border-left: 2px solid #f59e0b;
      padding: 2px 4px;
      border-radius: 3px;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pendencia-mini.concluida {
      color: #6ee7b7;
      background: rgba(16,185,129,0.1);
      border-left-color: #10b981;
      text-decoration: line-through;
    }

    .pendencia-mini.urgente {
      color: #fca5a5;
      background: rgba(239,68,68,0.15);
      border-left-color: #ef4444;
    }

    .mais-pendencias {
      font-size: 0.6rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 2px;
    }

    .btn-add-dia {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(99,102,241,0.4);
      border: none;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .dia-celula:hover .btn-add-dia {
      opacity: 1;
    }

    /* ===== PAINEL LATERAL ===== */
    .layout {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .calendario-wrapper {
      flex: 1;
    }

    .painel-lateral {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== FORMULÁRIO DE PENDÊNCIA ===== */
    .form-pendencia {
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .form-pendencia h3 {
      color: #c9d6ff;
      margin-bottom: 16px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      color: #94a3b8;
      font-size: 0.8rem;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      transition: border-color 0.3s;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #6366f1;
      background: rgba(99,102,241,0.1);
    }

    .form-group select option {
      background: #1e1b4b;
    }

    .btn-salvar {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .btn-salvar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    }

    /* ===== LISTA DE PENDÊNCIAS DO DIA ===== */
    .lista-dia {
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      max-height: 400px;
      overflow-y: auto;
    }

    .lista-dia h3 {
      color: #c9d6ff;
      margin-bottom: 14px;
      font-size: 1rem;
    }

    .item-pendencia {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border-left: 3px solid #6366f1;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.3s;
    }

    .item-pendencia.urgente { border-left-color: #ef4444; }
    .item-pendencia.normal  { border-left-color: #6366f1; }
    .item-pendencia.baixa   { border-left-color: #10b981; }
    .item-pendencia.concluida {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .item-pendencia input[type="checkbox"] {
      margin-top: 2px;
      accent-color: #6366f1;
      width: 16px;
      height: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-info { flex: 1; }

    .item-titulo {
      font-size: 0.88rem;
      color: #e2e8f0;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .item-meta {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: bold;
    }

    .tag-urgente { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .tag-normal  { background: rgba(99,102,241,0.2); color: #a5b4fc; }
    .tag-baixa   { background: rgba(16,185,129,0.2); color: #6ee7b7; }
    .tag-origem  { background: rgba(255,255,255,0.1); color: #cbd5e1; }

    .btn-excluir {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-excluir:hover { background: rgba(239,68,68,0.2); }

    .empty-msg {
      text-align: center;
      color: #4a5568;
      font-size: 0.85rem;
      padding: 20px 0;
    }

    /* ===== RESUMO GERAL ===== */
    .resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }

    .card-resumo {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .card-resumo .numero {
      font-size: 2rem;
      font-weight: bold;
      color: #6366f1;
    }

    .card-resumo .numero.urgente { color: #ef4444; }
    .card-resumo .numero.concluida { color: #10b981; }

    .card-resumo .label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.ativo {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: linear-gradient(135deg, #1e1b4b, #1a1a2e);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      border: 1px solid rgba(99,102,241,0.3);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.ativo .modal {
      transform: scale(1);
    }

    .modal h3 {
      color: #c9d6ff;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancelar {
      flex: 1;
      padding: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-cancelar:hover { background: rgba(255,255,255,0.15); }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.5); border-radius: 3px; }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .painel-lateral { width: 100%; }
      .resumo { grid-template-columns: repeat(3, 1fr); }
      .dia-celula { min-height: 70px; }
    }
  </style>
</head>
<body>

<h1>📅 Calendário de Pendências</h1>
<p class="subtitle">Visualize e gerencie todas as suas pendências em um só lugar</p>

<!-- RESUMO -->
<div class="resumo">
  <div class="card-resumo">
    <div class="numero" id="total-pendencias">0</div>
    <div class="label">Total</div>
  </div>
  <div class="card-resumo">
    <div class="numero urgente" id="total-urgentes">0</div>
    <div class="label">Urgentes</div>
  </div>
  <div class="card-resumo">
    <div class="numero concluida" id="total-concluidas">0</div>
    <div class="label">Concluídas</div>
  </div>
</div>

<div class="layout">
  <div class="calendario-wrapper">
    <!-- NAVEGAÇÃO -->
    <div class="nav-mes">
      <button onclick="mudarMes(-1)">&#8249;</button>
      <div id="titulo-mes"></div>
      <button onclick="mudarMes(1)">&#8250;</button>
    </div>

    <!-- CALENDÁRIO -->
    <div class="calendario-container">
      <div class="dias-semana">
        <div>Dom</div><div>Seg</div><div>Ter</div>
        <div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
      </div>
      <div class="grade-calendario" id="grade-calendario"></div>
    </div>
  </div>

  <!-- PAINEL LATERAL -->
  <div class="painel-lateral">

    <!-- FORMULÁRIO -->
    <div class="form-pendencia">
      <h3>✏️ <span id="form-titulo-dia">Nova Pendência</span></h3>

      <div class="form-group">
        <label>Título *</label>
        <input type="text" id="inp-titulo" placeholder="Ex: Reunião com cliente..." />
      </div>

      <div class="form-group">
        <label>Descrição</label>
        <textarea id="inp-desc" rows="2" placeholder="Detalhes da pendência..."></textarea>
      </div>

      <div class="form-group">
        <label>Data *</label>
        <input type="date" id="inp-data" />
      </div>

      <div class="form-group">
        <label>Prioridade</label>
        <select id="inp-prioridade">
          <option value="normal">🔵 Normal</option>
          <option value="urgente">🔴 Urgente</option>
          <option value="baixa">🟢 Baixa prioridade</option>
        </select>
      </div>

      <div class="form-group">
        <label>Origem / Arquivo</label>
        <select id="inp-origem">
          <option value="Calendário">📅 Calendário</option>
          <option value="Financeiro">💰 Financeiro</option>
          <option value="Clientes">👥 Clientes</option>
          <option value="Estoque">📦 Estoque</option>
          <option value="RH">👤 RH</option>
          <option value="Contratos">📋 Contratos</option>
          <option value="Outros">📁 Outros</option>
        </select>
      </div>

      <button class="btn-salvar" onclick="salvarPendencia()">➕ SALVAR PENDÊNCIA</button>
    </div>

    <!-- LISTA DO DIA SELECIONADO -->
    <div class="lista-dia">
      <h3 id="titulo-lista-dia">📋 Clique em um dia para ver</h3>
      <div id="lista-pendencias-dia">
        <p class="empty-msg">Selecione um dia no calendário</p>
      </div>
    </div>

  </div>
</div>

<!-- MODAL DE CONFIRMAÇÃO -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-titulo">Excluir Pendência?</h3>
    <p id="modal-msg" style="color:#94a3b8; font-size:0.9rem;"></p>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" style="flex:1;" id="modal-confirmar">Confirmar</button>
    </div>
  </div>
</div>

<script>
  // ========== ESTADO ==========
  let mesAtual = new Date().getMonth();
  let anoAtual = new Date().getFullYear();
  let diaSelecionado = null;
  let pendenciaParaExcluir = null;

  const MESES = [
    'Janeiro','Fevereiro','Março','Abril','Maio','Junho',
    'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'
  ];

  // ========== DADOS INICIAIS (simulando outros arquivos) ==========
  function carregarPendencias() {
    const salvas = localStorage.getItem('pendencias_calendario');
    if (salvas) return JSON.parse(salvas);

    // Pendências de exemplo de outros "arquivos/módulos"
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth() + 1).padStart(2, '0');
    const dia = String(hoje.getDate()).padStart(2, '0');
    const amanha = new Date(hoje); amanha.setDate(amanha.getDate() + 2);
    const da = `${amanha.getFullYear()}-${String(amanha.getMonth()+1).padStart(2,'0')}-${String(amanha.getDate()).padStart(2,'0')}`;
    const prox = new Date(hoje); prox.setDate(prox.getDate() + 5);
    const dp = `${prox.getFullYear()}-${String(prox.getMonth()+1).padStart(2,'0')}-${String(prox.getDate()).padStart(2,'0')}`;

    return [
      { id: 1, titulo: 'Pagamento fornecedor', desc: 'NF #4521 - vence hoje', data: `${ano}-${mes}-${dia}`, prioridade: 'urgente', origem: 'Financeiro', concluida: false },
      { id: 2, titulo: 'Reunião de equipe', desc: 'Sala 3 - 14h', data: `${ano}-${mes}-${dia}`, prioridade: 'normal', origem: 'RH', concluida: false },
      { id: 3, titulo: 'Enviar proposta cliente', desc: 'Cliente: João Silva', data: da, prioridade: 'urgente', origem: 'Clientes', concluida: false },
      { id: 4, titulo: 'Conferir estoque mínimo', desc: 'Produto: Resina EP', data: da, prioridade: 'normal', origem: 'Estoque', concluida: false },
      { id: 5, titulo: 'Renovar contrato anual', desc: 'Contrato #2023-A', data: dp, prioridade: 'baixa', origem: 'Contratos', concluida: false },
    ];
  }

  let pendencias = carregarPendencias();

  function salvarStorage() {
    localStorage.setItem('pendencias_calendario', JSON.stringify(pendencias));
  }

  // ========== CALENDÁRIO ==========
  function renderizarCalendario() {
    const grade = document.getElementById('grade-calendario');
    const titulo = document.getElementById('titulo-mes');
    grade.innerHTML = '';
    titulo.textContent = `${MESES[mesAtual]} de ${anoAtual}`;

    const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
    const totalDias = new Date(anoAtual, mesAtual + 1, 0).getDate();
    const totalDiasAnterior = new Date(anoAtual, mesAtual, 0).getDate();
    const hoje = new Date();

    // Dias do mês anterior
    for (let i = primeiroDia - 1; i >= 0; i--) {
      const cel = criarCelula(totalDiasAnterior - i, true, false, null);
      grade.appendChild(cel);
    }

    // Dias do mês atual
    for (let d = 1; d <= totalDias; d++) {
      const dataStr = `${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ehHoje = (d === hoje.getDate() && mesAtual === hoje.getMonth() && anoAtual === hoje.getFullYear());
      const pendsDia = pendencias.filter(p => p.data === dataStr);
      const cel = criarCelula(d, false, ehHoje, dataStr, pendsDia);
      grade.appendChild(cel);
    }

    // Completar com dias do próximo mês
    const total = primeiroDia + totalDias;
    const resto = total % 7 === 0 ? 0 : 7 - (total % 7);
    for (let i = 1; i <= resto; i++) {
      const cel = criarCelula(i, true, false, null);
      grade.appendChild(cel);
    }

    atualizarResumo();
  }

  function criarCelula(numero, outroMes, ehHoje, dataStr, pendsDia = []) {
    const cel = document.createElement('div');
    cel.className = 'dia-celula';
    if (outroMes) cel.classList.add('outro-mes');
    if (ehHoje) cel.classList.add('hoje');
    if (pendsDia.length > 0) cel.classList.add('tem-pendencia');

    const numDiv = document.createElement('div');
    numDiv.className = 'numero-dia';
    numDiv.textContent = numero;
    cel.appendChild(numDiv);

    if (pendsDia.length > 0) {
      const badge = document.createElement('div');
      badge.className = 'badge-pendencias';
      badge.textContent = `${pendsDia.length} pendência${pendsDia.length > 1 ? 's' : ''}`;
      cel.appendChild(badge);

      const limite = 3;
      pendsDia.slice(0, limite).forEach(p => {
        const mini = document.createElement('div');
        mini.className = 'pendencia-mini' + (p.concluida ? ' concluida' : '') + (p.prioridade === 'urgente' ? ' urgente' : '');
        mini.textContent = p.titulo;
        mini.title = p.titulo;
        cel.appendChild(mini);
      });

      if (pendsDia.length > limite) {
        const mais = document.createElement('div');
        mais.className = 'mais-pendencias';
        mais.textContent = `+${pendsDia.length - limite} mais...`;
        cel.appendChild(mais);
      }
    }

    if (!outroMes && dataStr) {
      const btnAdd = document.createElement('button');
      btnAdd.className = 'btn-add-dia';
      btnAdd.textContent = '+';
      btnAdd.title = 'Adicionar pendência neste dia';
      btnAdd.onclick = (e) => {
        e.stopPropagation();
        document.getElementById('inp-data').value = dataStr;
        document.getElementById('inp-titulo').focus();
        document.getElementById('form-titulo-dia').textContent = `Nova Pendência - ${numero}/${mesAtual+1}/${anoAtual}`;
      };
      cel.appendChild(btnAdd);

      cel.addEventListener('click', () => {
        diaSelecionado = dataStr;
        mostrarPendenciasDia(dataStr, numero);
        document.getElementById('inp-data').value = dataStr;
        document.getElementById('form-titulo-dia').textContent = `Pendência - ${numero}/${mesAtual+1}/${anoAtual}`;
      });
    }

    return cel;
  }

  // ========== PENDÊNCIAS DO DIA ==========
  function mostrarPendenciasDia(dataStr, numero) {
    const lista = document.getElementById('lista-pendencias-dia');
    const titulo = document.getElementById('titulo-lista-dia');
    const parts = dataStr.split('-');
    titulo.textContent = `📋 ${parts[2]}/${parts[1]}/${parts[0]}`;

    const pends = pendencias.filter(p => p.data === dataStr);
    lista.innerHTML = '';

    if (pends.length === 0) {
      lista.innerHTML = '<p class="empty-msg">Nenhuma pendência neste dia.<br/>Use o formulário ao lado para adicionar! ✨</p>';
      return;
    }

    pends.forEach(p => {
      const item = document.createElement('div');
      item.className = `item-pendencia ${p.prioridade}${p.concluida ? ' concluida' : ''}`;
      item.innerHTML = `
        <input type="checkbox" ${p.concluida ? 'checked' : ''} onchange="toggleConcluida(${p.id})" />
        <div class="item-info">
          <div class="item-titulo">${p.titulo}</div>
          ${p.desc ? `<div class="item-desc">${p.desc}</div>` : ''}
          <div class="item-meta">
            <span class="tag tag-${p.prioridade}">${p.prioridade.toUpperCase()}</span>
            <span class="tag tag-origem">📁 ${p.origem}</span>
          </div>
        </div>
        <button class="btn-excluir" onclick="confirmarExcluir(${p.id}, '${p.titulo.replace(/'/g, "\\'")}')">🗑️</button>
      `;
      lista.appendChild(item);
    });
  }

  // ========== TOGGLE CONCLUÍDA ==========
  function toggleConcluida(id) {
    const p = pendencias.find(x => x.id === id);
    if (p) {
      p.concluida = !p.concluida;
      salvarStorage();
      renderizarCalendario();
      if (diaSelecionado) mostrarPendenciasDia(diaSelecionado);
    }
  }

  // ========== SALVAR PENDÊNCIA ==========
  function salvarPendencia() {
    const titulo = document.getElementById('inp-titulo').value.trim();
    const desc   = document.getElementById('inp-desc').value.trim();
    const data   = document.getElementById('inp-data').value;
    const prior  = document.getElementById('inp-prioridade').value;
    const origem = document.getElementById('inp-origem').value;

    if (!titulo) { alert('Por favor, informe o título da pendência.'); return; }
    if (!data)   { alert('Por favor, selecione uma data.'); return; }

    const nova = {
      id: Date.now(),
      titulo, desc, data,
      prioridade: prior,
      origem,
      concluida: false
    };

    pendencias.push(nova);
    salvarStorage();
    renderizarCalendario();

    // Limpar formulário
    document.getElementById('inp-titulo').value = '';
    document.getElementById('inp-desc').value = '';
    document.getElementById('inp-prioridade').value = 'normal';
    document.getElementById('form-titulo-dia').textContent = 'Nova Pendência';

    // Atualizar lista se dia está selecionado
    if (diaSelecionado === data) mostrarPendenciasDia(data);

    // Feedback
    const btn = document.querySelector('.btn-salvar');
    const orig = btn.textContent;
    btn.textContent = '✅ SALVO!';
    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
    }, 2000);
  }

  // ========== EXCLUIR ==========
  function confirmarExcluir(id, titulo) {
    pendenciaParaExcluir = id;
    document.getElementById('modal-msg').textContent = `"${titulo}"`;
    document.getElementById('modal-overlay').classList.add('ativo');
    document.getElementById('modal-confirmar').onclick = () => {
      pendencias = pendencias.filter(p => p.id !== id);
      salvarStorage();
      renderizarCalendario();
      if (diaSelecionado) mostrarPendenciasDia(diaSelecionado);
      fecharModal();
    };
  }

  function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('ativo');
  }

  // ========== RESUMO ==========
  function atualizarResumo() {
    document.getElementById('total-pendencias').textContent = pendencias.length;
    document.getElementById('total-urgentes').textContent = pendencias.filter(p => p.prioridade === 'urgente' && !p.concluida).length;
    document.getElementById('total-concluidas').textContent = pendencias.filter(p => p.concluida).length;
  }

  // ========== NAVEGAÇÃO ==========
  function mudarMes(dir) {
    mesAtual += dir;
    if (mesAtual > 11) { mesAtual = 0; anoAtual++; }
    if (mesAtual < 0)  { mesAtual = 11; anoAtual--; }
    renderizarCalendario();
  }

  // ========== DATA PADRÃO ==========
  function setDataHoje() {
    const hoje = new Date();
    const y = hoje.getFullYear();
    const m = String(hoje.getMonth()+1).padStart(2,'0');
    const d = String(hoje.getDate()).padStart(2,'0');
    document.getElementById('inp-data').value = `${y}-${m}-${d}`;
  }

  // ========== INICIALIZAR ==========
  setDataHoje();
  renderizarCalendario();
</script>
</body>
</html>
