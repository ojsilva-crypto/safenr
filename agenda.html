<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Agenda</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(0,212,255,.12);border-color:#00d4ff;color:#00d4ff}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:220px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#00d4ff}
    .agenda-lista{display:flex;flex-direction:column;gap:10px}
    .agenda-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:16px;transition:all .2s;border-left:4px solid transparent}
    .agenda-item:hover{background:rgba(255,255,255,.05)}
    .agenda-item.hoje{border-left-color:#00d4ff;background:rgba(0,212,255,.04)}
    .agenda-item.atrasado{border-left-color:#f87171;background:rgba(248,113,113,.04)}
    .agenda-item.futuro{border-left-color:#4ade80}
    .agenda-item.concluido{opacity:.5}
    .ag-data{text-align:center;min-width:52px;flex-shrink:0}
    .ag-data .dia{font-size:1.6rem;font-weight:900;line-height:1}
    .ag-data .mes{font-size:.7rem;text-transform:uppercase;color:rgba(255,255,255,.4);letter-spacing:.5px}
    .ag-corpo{flex:1}
    .ag-titulo{font-size:.9rem;font-weight:700;margin-bottom:4px}
    .ag-meta{display:flex;gap:12px;font-size:.75rem;color:rgba(255,255,255,.4);flex-wrap:wrap}
    .badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
    .badge.pendente{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.concluido{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.cancelado{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .badge.treinamento{background:rgba(129,140,248,.15);color:#818cf8}
    .badge.inspecao{background:rgba(0,212,255,.15);color:#00d4ff}
    .badge.ocorrencia{background:rgba(248,113,113,.15);color:#f87171}
    .badge.plano{background:rgba(52,211,153,.15);color:#34d399}
    .badge.geral{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
    .ag-acoes{display:flex;gap:6px;flex-shrink:0}
    .btn-acao{background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:6px 10px;font-size:.8rem;color:rgba(255,255,255,.5);transition:all .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#00d4ff}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:70px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .detalhe-row{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .detalhe-row:last-child{border-bottom:none}
    .detalhe-label{font-size:.78rem;color:rgba(255,255,255,.4);min-width:140px;font-weight:600}
    .detalhe-valor{font-size:.88rem;color:#fff;flex:1}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>📅 Agenda SST</h2><span id="totalRegistros">0 eventos</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo Evento</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-hoje" style="color:#00d4ff">0</div>
      <div class="rc-label">Hoje</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-semana" style="color:#818cf8">0</div>
      <div class="rc-label">Esta Semana</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-atrasado" style="color:#f87171">0</div>
      <div class="rc-label">Atrasados</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-concluido" style="color:#4ade80">0</div>
      <div class="rc-label">Concluidos</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"   onclick="filtrar('todos',this)">Todos</button>
    <button class="filtro-btn" id="fb-hoje"    onclick="filtrar('hoje',this)">📅 Hoje</button>
    <button class="filtro-btn" id="fb-semana"  onclick="filtrar('semana',this)">📆 Esta Semana</button>
    <button class="filtro-btn" id="fb-atrasado" onclick="filtrar('atrasado',this)">⚠️ Atrasados</button>
    <button class="filtro-btn" id="fb-pendente" onclick="filtrar('pendente',this)">🕐 Pendentes</button>
    <button class="filtro-btn" id="fb-concluido" onclick="filtrar('concluido',this)">✅ Concluidos</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar evento..." oninput="renderizar(getLista())"/>
  </div>
  <div class="agenda-lista" id="agendaLista"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div>📅</div><p>Nenhum evento encontrado.<br>Clique em <strong>+ Novo Evento</strong>.</p>
  </div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">📅 Novo Evento</h3>
    <div class="form-row full">
      <div class="form-group">
        <label>Titulo do Evento *</label>
        <input type="text" id="f_titulo" placeholder="Ex: Treinamento NR-35"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data *</label>
        <input type="date" id="f_data"/>
      </div>
      <div class="form-group">
        <label>Hora</label>
        <input type="time" id="f_hora"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo</label>
        <select id="f_tipo">
          <option value="geral">Geral</option>
          <option value="treinamento">Treinamento</option>
          <option value="inspecao">Inspecao</option>
          <option value="ocorrencia">Ocorrencia</option>
          <option value="plano">Plano de Acao</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f_status">
          <option value="pendente">Pendente</option>
          <option value="concluido">Concluido</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observacoes</label>
        <textarea id="f_obs" placeholder="Detalhes do evento..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalVer">
  <div class="modal">
    <h3>📅 Detalhes do Evento</h3>
    <div id="modalVerConteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharVer()">Fechar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_agenda')||'[]');
var editandoId=null,filtroAtivo='todos';
function salvarStorage(){localStorage.setItem('safenr_agenda',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getDiff(d){if(!d)return null;var h=new Date();h.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-h)/86400000);}
function getClasse(r){
  if(r.status==='concluido')return 'concluido';
  var d=getDiff(r.data);
  if(d===null)return '';
  if(d<0)return 'atrasado';
  if(d===0)return 'hoje';
  return 'futuro';
}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  var hoje=new Date();hoje.setHours(0,0,0,0);
  return registros.filter(function(r){
    var d=r.data?new Date(r.data+'T00:00:00'):null;
    var diff=d?Math.round((d-hoje)/86400000):null;
    if(filtroAtivo==='hoje'&&diff!==0)return false;
    if(filtroAtivo==='semana'&&(diff===null||diff<0||diff>7))return false;
    if(filtroAtivo==='atrasado'&&(diff===null||diff>=0||r.status==='concluido'))return false;
    if(filtroAtivo==='pendente'&&r.status!=='pendente')return false;
    if(filtroAtivo==='concluido'&&r.status!=='concluido')return false;
    if(busca&&!(r.titulo||'').toLowerCase().includes(busca)&&!(r.obs||'').toLowerCase().includes(busca))return false;
    return true;
  }).sort(function(a,b){return (a.data||'').localeCompare(b.data||'');});
}
function atualizarContadores(){
  var hoje=new Date();hoje.setHours(0,0,0,0);
  document.getElementById('cnt-hoje').textContent=registros.filter(function(r){return getDiff(r.data)===0&&r.status!=='concluido';}).length;
  document.getElementById('cnt-semana').textContent=registros.filter(function(r){var d=getDiff(r.data);return d!==null&&d>=0&&d<=7&&r.status!=='concluido';}).length;
  document.getElementById('cnt-atrasado').textContent=registros.filter(function(r){var d=getDiff(r.data);return d!==null&&d<0&&r.status!=='concluido';}).length;
  document.getElementById('cnt-concluido').textContent=registros.filter(function(r){return r.status==='concluido';}).length;
  document.getElementById('totalRegistros').textContent=registros.length+' evento(s)';
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function renderizar(lista){
  var cont=document.getElementById('agendaLista');
  var empty=document.getElementById('emptyState');
  cont.innerHTML='';atualizarContadores();
  if(lista.length===0){empty.style.display='block';return;}
  empty.style.display='none';
  lista.forEach(function(r){
    var cls=getClasse(r);
    var d=r.data?new Date(r.data+'T00:00:00'):null;
    var dia=d?String(d.getDate()).padStart(2,'0'):'--';
    var mes=d?d.toLocaleString('pt-BR',{month:'short'}):'--';
    var diff=getDiff(r.data);
    var prazoTxt=diff===null?'':(diff<0?'⛔ '+Math.abs(diff)+'d atrasado':diff===0?'📍 Hoje':diff<=7?'⚠️ Em '+diff+' dias':'✅ Em '+diff+' dias');
    var div=document.createElement('div');
    div.className='agenda-item '+cls;
    div.innerHTML=
      '<div class="ag-data"><div class="dia">'+dia+'</div><div class="mes">'+mes+'</div></div>'+
      '<div class="ag-corpo">'+
        '<div class="ag-titulo">'+(r.titulo||'--')+'</div>'+
        '<div class="ag-meta">'+
          '<span class="badge '+(r.tipo||'geral')+'">'+(r.tipo||'geral')+'</span>'+
          '<span class="badge '+(r.status||'pendente')+'">'+(r.status||'pendente')+'</span>'+
          (r.hora?'<span>🕐 '+r.hora+'</span>':'')+
          (prazoTxt?'<span>'+prazoTxt+'</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="ag-acoes">'+
        '<button class="btn-acao" onclick="ver('+r.id+')">👁️</button>'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️</button>'+
        (r.status!=='concluido'?'<button class="btn-acao" onclick="concluir('+r.id+')" style="color:#4ade80">✔</button>':'')+
        '<button class="btn-acao" onclick="excluir('+r.id+')" style="color:rgba(248,113,113,.7)">🗑️</button>'+
      '</div>';
    cont.appendChild(div);
  });
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'📅 Novo')+' Evento';
  ['f_titulo','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_data').value='';document.getElementById('f_hora').value='';
  document.getElementById('f_tipo').value='geral';document.getElementById('f_status').value='pendente';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){var r=registros.find(function(x){return x.id===id;});document.getElementById('f_titulo').value=r.titulo||'';document.getElementById('f_data').value=r.data||'';document.getElementById('f_hora').value=r.hora||'';document.getElementById('f_tipo').value=r.tipo||'geral';document.getElementById('f_status').value=r.status||'pendente';document.getElementById('f_obs').value=r.obs||'';document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);}
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var titulo=document.getElementById('f_titulo').value.trim();
  var data=document.getElementById('f_data').value;
  if(!titulo||!data){alert('Preencha Titulo e Data.');return;}
  var dados={titulo:titulo,data:data,hora:document.getElementById('f_hora').value,tipo:document.getElementById('f_tipo').value,status:document.getElementById('f_status').value,obs:document.getElementById('f_obs').value.trim()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function concluir(id){var idx=registros.findIndex(function(r){return r.id===id;});if(idx>=0){registros[idx].status='concluido';salvarStorage();renderizar(getLista());}}
function excluir(id){if(!confirm('Excluir este evento?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function ver(id){
  var r=registros.find(function(x){return x.id===id;});
  function row(l,v){return '<div class="detalhe-row"><span class="detalhe-label">'+l+'</span><span class="detalhe-valor">'+v+'</span></div>';}
  document.getElementById('modalVerConteudo').innerHTML=row('Titulo',r.titulo||'--')+row('Data',fmt(r.data)+(r.hora?' às '+r.hora:''))+row('Tipo','<span class="badge '+(r.tipo||'geral')+'">'+(r.tipo||'--')+'</span>')+row('Status','<span class="badge '+(r.status||'pendente')+'">'+(r.status||'--')+'</span>')+row('Observacoes',r.obs||'--')+row('Registrado por','<span style="color:#00d4ff">'+(r.registradoPor||'--')+'</span>')+row('Registrado em','<span style="color:#00d4ff">'+fmtDT(r.registradoEm)+'</span>');
  document.getElementById('modalVer').classList.add('open');
}
function fecharVer(){document.getElementById('modalVer').classList.remove('open');}
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.getElementById('modalVer').addEventListener('click',function(e){if(e.target===this)fecharVer();});
renderizar(getLista());
</script>
</body>
</html>
