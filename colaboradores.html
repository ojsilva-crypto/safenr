<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Colaboradores</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(0,212,255,.12);border-color:#00d4ff;color:#00d4ff}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#00d4ff}
    .grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .colab-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;transition:all .2s}
    .colab-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.05)}
    .colab-card-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
    .colab-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#0099cc);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;flex-shrink:0}
    .colab-nome{font-size:.95rem;font-weight:700;margin-bottom:2px}
    .colab-cargo{font-size:.78rem;color:rgba(255,255,255,.45)}
    .colab-info{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .colab-info-row{font-size:.78rem;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:6px}
    .badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700}
    .badge.ativo{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.inativo{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .badge.afastado{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.ferias{background:rgba(96,165,250,.15);color:#60a5fa}
    .colab-acoes{display:flex;gap:8px;justify-content:flex-end}
    .btn-acao{background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:6px 12px;font-size:.8rem;color:rgba(255,255,255,.6);transition:all .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#00d4ff}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:60px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .secao-titulo{font-size:.78rem;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(0,212,255,.15)}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .detalhe-row{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .detalhe-row:last-child{border-bottom:none}
    .detalhe-label{font-size:.78rem;color:rgba(255,255,255,.4);min-width:160px;font-weight:600}
    .detalhe-valor{font-size:.88rem;color:#fff;flex:1}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>👷 Colaboradores</h2><span id="totalRegistros">0 registros</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo Colaborador</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-ativo" style="color:#4ade80">0</div>
      <div class="rc-label">Ativos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-afastado" style="color:#fbbf24">0</div>
      <div class="rc-label">Afastados</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-ferias" style="color:#60a5fa">0</div>
      <div class="rc-label">De Férias</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-inativo" style="color:rgba(255,255,255,.3)">0</div>
      <div class="rc-label">Inativos</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"    onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-ativo"    onclick="filtrar('ativo',this)">✅ Ativos</button>
    <button class="filtro-btn" id="fb-afastado" onclick="filtrar('afastado',this)">🟡 Afastados</button>
    <button class="filtro-btn" id="fb-ferias"   onclick="filtrar('ferias',this)">🔵 Férias</button>
    <button class="filtro-btn" id="fb-inativo"  onclick="filtrar('inativo',this)">⚫ Inativos</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar colaborador..." oninput="renderizar(getLista())"/>
  </div>
  <div class="grid-cards" id="gridCards"></div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">👷 Novo Colaborador</h3>
    <div class="secao-titulo">Dados Pessoais</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" id="f_nome" placeholder="Nome do colaborador"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>CPF</label>
        <input type="text" id="f_cpf" placeholder="000.000.000-00" maxlength="14"/>
      </div>
      <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="date" id="f_nascimento"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Telefone</label>
        <input type="text" id="f_tel" placeholder="(47) 99999-0000"/>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="f_email" placeholder="email@empresa.com"/>
      </div>
    </div>
    <div class="secao-titulo">Dados Profissionais</div>
    <div class="form-row">
      <div class="form-group">
        <label>Cargo / Função *</label>
        <input type="text" id="f_cargo" placeholder="Ex: Operador de Máquinas"/>
      </div>
      <div class="form-group">
        <label>Setor / Departamento</label>
        <input type="text" id="f_setor" placeholder="Ex: Produção"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Matrícula</label>
        <input type="text" id="f_matricula" placeholder="Ex: 00123"/>
      </div>
      <div class="form-group">
        <label>Data de Admissão</label>
        <input type="date" id="f_admissao"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo de Contrato</label>
        <select id="f_contrato">
          <option value="clt">CLT</option>
          <option value="pj">PJ</option>
          <option value="temporario">Temporário</option>
          <option value="estagio">Estágio</option>
          <option value="aprendiz">Jovem Aprendiz</option>
          <option value="terceirizado">Terceirizado</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status *</label>
        <select id="f_status">
          <option value="ativo">Ativo</option>
          <option value="afastado">Afastado</option>
          <option value="ferias">De Férias</option>
          <option value="inativo">Inativo</option>
        </select>
      </div>
    </div>
    <div class="secao-titulo">Saúde Ocupacional</div>
    <div class="form-row">
      <div class="form-group">
        <label>Data do ASO</label>
        <input type="date" id="f_aso"/>
      </div>
      <div class="form-group">
        <label>Validade do ASO</label>
        <input type="date" id="f_asoVal"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observações</label>
        <textarea id="f_obs" placeholder="Restrições médicas, observações..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalVer">
  <div class="modal">
    <h3>👷 Perfil do Colaborador</h3>
    <div id="modalVerConteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharVer()">Fechar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_colaboradores')||'[]');
var editandoId=null,filtroAtivo='';
function salvarStorage(){localStorage.setItem('safenr_colaboradores',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    if(filtroAtivo&&r.status!==filtroAtivo)return false;
    if(busca&&!(r.nome||'').toLowerCase().includes(busca)&&!(r.cargo||'').toLowerCase().includes(busca)&&!(r.setor||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function atualizarContadores(){
  ['ativo','afastado','ferias','inativo'].forEach(function(s){
    document.getElementById('cnt-'+s).textContent=registros.filter(function(r){return r.status===s;}).length;
  });
  document.getElementById('totalRegistros').textContent=registros.length+' registro(s)';
}
function renderizar(lista){
  var grid=document.getElementById('gridCards');
  grid.innerHTML='';atualizarContadores();
  if(lista.length===0){grid.innerHTML='<div class="empty-state"><div>👷</div><p>Nenhum colaborador encontrado.<br>Clique em <strong>+ Novo Colaborador</strong>.</p></div>';return;}
  lista.forEach(function(r){
    var letra=(r.nome||'?')[0].toUpperCase();
    var treins=JSON.parse(localStorage.getItem('safenr_treinamentos')||'[]').filter(function(t){return (t.participantes||[]).indexOf(r.id)>-1;}).length;
    var div=document.createElement('div');
    div.className='colab-card';
    div.innerHTML=
      '<div class="colab-card-top">'+
        '<div class="colab-avatar">'+letra+'</div>'+
        '<div><div class="colab-nome">'+(r.nome||'--')+'</div><div class="colab-cargo">'+(r.cargo||'--')+'</div></div>'+
        '<span class="badge '+(r.status||'ativo')+'" style="margin-left:auto">'+(r.status||'ativo')+'</span>'+
      '</div>'+
      '<div class="colab-info">'+
        '<div class="colab-info-row">🏭 '+(r.setor||'--')+'</div>'+
        '<div class="colab-info-row">📋 '+(r.contrato||'clt').toUpperCase()+'</div>'+
        '<div class="colab-info-row">📅 Admissão: '+fmt(r.admissao)+'</div>'+
        '<div class="colab-info-row">🏥 ASO: '+fmt(r.asoVal)+'</div>'+
        '<div class="colab-info-row">🎓 '+treins+' treinamento(s)</div>'+
      '</div>'+
      '<div class="colab-acoes">'+
        '<button class="btn-acao" onclick="ver('+r.id+')">👁️ Ver</button>'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️ Editar</button>'+
        '<button class="btn-acao" onclick="excluir('+r.id+')" style="color:rgba(248,113,113,.7)">🗑️</button>'+
      '</div>';
    grid.appendChild(div);
  });
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'👷 Novo')+' Colaborador';
  ['f_nome','f_cpf','f_tel','f_email','f_cargo','f_setor','f_matricula','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  ['f_nascimento','f_admissao','f_aso','f_asoVal'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_contrato').value='clt';document.getElementById('f_status').value='ativo';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_nome').value=r.nome||'';document.getElementById('f_cpf').value=r.cpf||'';
    document.getElementById('f_nascimento').value=r.nascimento||'';document.getElementById('f_tel').value=r.tel||'';
    document.getElementById('f_email').value=r.email||'';document.getElementById('f_cargo').value=r.cargo||'';
    document.getElementById('f_setor').value=r.setor||'';document.getElementById('f_matricula').value=r.matricula||'';
    document.getElementById('f_admissao').value=r.admissao||'';document.getElementById('f_contrato').value=r.contrato||'clt';
    document.getElementById('f_status').value=r.status||'ativo';document.getElementById('f_aso').value=r.aso||'';
    document.getElementById('f_asoVal').value=r.asoVal||'';document.getElementById('f_obs').value=r.obs||'';
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var nome=document.getElementById('f_nome').value.trim();
  var cargo=document.getElementById('f_cargo').value.trim();
  if(!nome||!cargo){alert('Preencha Nome e Cargo.');return;}
  var dados={nome:nome,cpf:document.getElementById('f_cpf').value.trim(),nascimento:document.getElementById('f_nascimento').value,tel:document.getElementById('f_tel').value.trim(),email:document.getElementById('f_email').value.trim(),cargo:cargo,setor:document.getElementById('f_setor').value.trim(),matricula:document.getElementById('f_matricula').value.trim(),admissao:document.getElementById('f_admissao').value,contrato:document.getElementById('f_contrato').value,status:document.getElementById('f_status').value,aso:document.getElementById('f_aso').value,asoVal:document.getElementById('f_asoVal').value,obs:document.getElementById('f_obs').value.trim()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir este colaborador?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function ver(id){
  var r=registros.find(function(x){return x.id===id;});
  function row(l,v){return '<div class="detalhe-row"><span class="detalhe-label">'+l+'</span><span class="detalhe-valor">'+v+'</span></div>';}
  var letra=(r.nome||'?')[0].toUpperCase();
  document.getElementById('modalVerConteudo').innerHTML=
    '<div style="text-align:center;margin-bottom:20px"><div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#0099cc);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;margin:0 auto 8px">'+letra+'</div><span class="badge '+(r.status||'ativo')+'">'+(r.status||'ativo')+'</span></div>'+
    row('Nome',r.nome||'--')+row('CPF',r.cpf||'--')+row('Nascimento',fmt(r.nascimento))+
    row('Telefone',r.tel||'--')+row('E-mail',r.email||'--')+
    row('Cargo',r.cargo||'--')+row('Setor',r.setor||'--')+row('Matrícula',r.matricula||'--')+
    row('Admissão',fmt(r.admissao))+row('Contrato',(r.contrato||'clt').toUpperCase())+
    row('ASO',fmt(r.aso))+row('Validade ASO',fmt(r.asoVal))+
    row('Observações',r.obs||'--')+
    row('Registrado por','<span style="color:#00d4ff">'+(r.registradoPor||'--')+'</span>')+
    row('Registrado em','<span style="color:#00d4ff">'+fmtDT(r.registradoEm)+'</span>');
  document.getElementById('modalVer').classList.add('open');
}
function fecharVer(){document.getElementById('modalVer').classList.remove('open');}
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.getElementById('modalVer').addEventListener('click',function(e){if(e.target===this)fecharVer();});
renderizar(getLista());
</script>
</body>
</html>
