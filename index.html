<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>SafeNR — Login</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0f1923;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif}
    .box{background:#0a1520;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:36px;width:340px;text-align:center}
    h1{color:#fff;font-size:1.8rem;font-weight:900;margin-bottom:4px}
    h1 span{color:#00d4ff}
    p{color:rgba(255,255,255,.35);font-size:.8rem;margin-bottom:24px}
    input{width:100%;background:#111c28;border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:12px;font-size:.9rem;outline:none;margin-bottom:12px;display:block}
    input:focus{border-color:#00d4ff}
    button{width:100%;background:#00d4ff;color:#0f1923;border:none;border-radius:10px;padding:13px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:4px}
    .erro{color:#f87171;font-size:.82rem;margin-top:10px;display:none}
    .dica{margin-top:16px;background:#111c28;border-radius:10px;padding:12px;text-align:left}
    .dica p{color:rgba(255,255,255,.4);font-size:.72rem;margin-bottom:6px;text-transform:uppercase;font-weight:700}
    .dica div{color:rgba(255,255,255,.6);font-size:.8rem;line-height:1.8}
    .dica span{color:#00d4ff;cursor:pointer;font-weight:700}
  </style>
</head>
<body>
<div class="box">
  <h1>Safe<span>NR</span></h1>
  <p>Sistema de Gestão SST</p>

  <input type="email"    id="email" placeholder="E-mail"  value="admin@safenr.com.br"/>
  <input type="password" id="senha" placeholder="Senha"
         onkeydown="if(event.key==='Enter')entrar()"/>
  <button onclick="entrar()">Entrar no SafeNR</button>
  <div class="erro" id="erro">E-mail ou senha incorretos.</div>

  <div class="dica">
    <p>Credenciais de acesso</p>
    <div>
      admin@safenr.com.br → <span onclick="preencher('admin@safenr.com.br','admin123')">admin123</span><br/>
      tecnico@safenr.com.br → <span onclick="preencher('tecnico@safenr.com.br','tec123')">tec123</span><br/>
      gestor@safenr.com.br → <span onclick="preencher('gestor@safenr.com.br','gest123')">gest123</span>
    </div>
  </div>
</div>

<script>
  var USUARIOS = [
    {email:'admin@safenr.com.br',   senha:'admin123', nome:'Odair',   perfil:'admin'},
    {email:'tecnico@safenr.com.br', senha:'tec123',   nome:'Técnico', perfil:'tecnico'},
    {email:'gestor@safenr.com.br',  senha:'gest123',  nome:'Gestor',  perfil:'gestor'}
  ];

  function preencher(email, senha) {
    document.getElementById('email').value = email;
    document.getElementById('senha').value = senha;
    document.getElementById('erro').style.display = 'none';
  }

  function entrar() {
    var email = document.getElementById('email').value.trim().toLowerCase();
    var senha = document.getElementById('senha').value.trim();
    var u = USUARIOS.find(function(x){ return x.email===email && x.senha===senha; });
    if (u) {
      localStorage.setItem('safenr_user', JSON.stringify({
        nome: u.nome, email: u.email, perfil: u.perfil,
        empresa: 'SafeNR', empresaId: 'demo'
      }));
      window.location.href = './app.html';
    } else {
      document.getElementById('erro').style.display = 'block';
      document.getElementById('senha').value = '';
    }
  }

  if (localStorage.getItem('safenr_user')) {
    window.location.href = './app.html';
  }
</script>
</body>
</html>
