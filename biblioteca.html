<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biblioteca de NRs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    header h1 { font-size: 1.5rem; }
    header span { font-size: 2rem; }

    .search-bar {
      padding: 20px 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-bar input {
      flex: 1;
      min-width: 220px;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .search-bar input:focus { border-color: #1a73e8; }

    .search-bar select {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: white;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 10px 30px 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border-left: 5px solid #1a73e8;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    .card .nr-number {
      font-size: 0.8rem;
      color: #1a73e8;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card p {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.5;
    }

    .card .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #e8f0fe;
      color: #1a73e8;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 5px;
      color: #1a73e8;
    }

    .modal .nr-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 15px;
      display: block;
    }

    .modal p {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #444;
      margin-bottom: 15px;
    }

    .modal a.btn-link {
      display: inline-block;
      margin-top: 5px;
      padding: 10px 20px;
      background: #1a73e8;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .modal a.btn-link:hover { background: #1558b0; }

    .modal .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
      transition: color 0.2s;
    }

    .modal .close-btn:hover { color: #333; }

    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 1rem;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  <span>📋</span>
  <div>
    <h1>Biblioteca de Normas Regulamentadoras</h1>
    <small>Ministério do Trabalho e Emprego — MTE</small>
  </div>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Pesquisar norma..." oninput="renderCards()" />
  <select id="filterSelect" onchange="renderCards()">
    <option value="">Todas as categorias</option>
    <option value="segurança">Segurança</option>
    <option value="saúde">Saúde</option>
    <option value="ergonomia">Ergonomia</option>
    <option value="equipamento">Equipamento</option>
    <option value="treinamento">Treinamento</option>
  </select>
</div>

<div class="grid" id="nrGrid"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <button class="close-btn" onclick="closeModalBtn()">✕</button>
    <h2 id="modalTitle"></h2>
    <span class="nr-label" id="modalLabel"></span>
    <p id="modalDesc"></p>
    <p id="modalDetail"></p>
    <a class="btn-link" id="modalLink" href="#" target="_blank">🔗 Acessar norma oficial</a>
  </div>
</div>

<footer>Dados baseados nas NRs do Ministério do Trabalho e Emprego • Atualizado em 2025</footer>

<script>
  const nrs = [
    {
      numero: "NR-1",

      detalhe: "Define os direitos e obrigações de empregados e empregadores quanto à SST, além de exigir o inventário de riscos e o Plano de Ação como parte do PGR.",
      categoria: "segurança",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-1-nr-1"
    },
    {
      numero: "NR-4",
      titulo: "Serviços Especializados em Segurança e Medicina do Trabalho (SESMT)",

      detalhe: "O SESMT é composto por médico do trabalho, engenheiro de segurança, técnico de segurança, enfermeiro e auxiliar de enfermagem do trabalho, conforme dimensionamento específico.",
      categoria: "saúde",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-4-nr-4"
    },
    {
      numero: "NR-5",
      titulo: "Comissão Interna de Prevenção de Acidentes (CIPA)",
      resumo: "Regulamenta a constituição e funcionamento da CIPA nas empresas.",
      detalhe: "A CIPA tem como objetivo a prevenção de acidentes e doenças decorrentes do trabalho, por meio de ações que promovam a saúde e a segurança dos trabalhadores.",
      categoria: "segurança",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-5-nr-5"
    },
    {
      numero: "NR-6",
      titulo: "Equipamentos de Proteção Individual (EPI)",
      resumo: "Define as obrigações relacionadas ao fornecimento, uso e conservação de EPIs.",
      detalhe: "O empregador deve fornecer EPI adequado ao risco, em perfeito estado de conservação e funcionamento, de forma gratuita ao trabalhador.",
      categoria: "equipamento",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-6-nr-6"
    },
    {
      numero: "NR-7",
      titulo: "Programa de Controle Médico de Saúde Ocupacional (PCMSO)",
      resumo: "Estabelece a obrigatoriedade do PCMSO para promoção e preservação da saúde dos trabalhadores.",
      detalhe: "O PCMSO inclui exames médicos admissional, periódico, de retorno ao trabalho, de mudança de função e demissional, monitorando a saúde dos empregados.",
      categoria: "saúde",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-7-nr-7"
    },
    {
      numero: "NR-9",
      titulo: "Avaliação e Controle das Exposições Ocupacionais a Agentes Físicos, Químicos e Biológicos",
      resumo: "Determina a necessidade de identificar, avaliar e controlar riscos ambientais nos locais de trabalho.",
      detalhe: "Os resultados das avaliações devem compor o inventário de riscos do PGR, com plano de ação para controle das exposições acima dos limites toleráveis.",
      categoria: "saúde",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-9-nr-9"
    },
    {
      numero: "NR-10",
      titulo: "Segurança em Instalações e Serviços em Eletricidade",
      resumo: "Estabelece requisitos mínimos para garantir a segurança dos trabalhadores que interagem com instalações elétricas.",
      detalhe: "Abrange medidas de controle do risco elétrico, habilitação e qualificação dos profissionais, uso de EPIs e EPCs, e procedimentos de trabalho seguro.",
      categoria: "segurança",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-10-nr-10"
    },
    {
      numero: "NR-12",
      titulo: "Segurança no Trabalho em Máquinas e Equipamentos",
      resumo: "Define medidas de proteção para garantir a saúde e integridade física dos trabalhadores em máquinas e equipamentos.",
      detalhe: "Exige proteções físicas, dispositivos de segurança, sinalização, capacitação dos operadores e elaboração de documentação técnica específica.",
      categoria: "equipamento",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-12-nr-12"
    },
    {
      numero: "NR-17",
      titulo: "Ergonomia",
      resumo: "Visa estabelecer parâmetros para adaptação das condições de trabalho às características psicofisiológicas dos trabalhadores.",
      detalhe: "Abrange mobiliário, equipamentos, condições ambientais, organização do trabalho e treinamento, buscando conforto, segurança e eficiência.",
      categoria: "ergonomia",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-17-nr-17"
    },
    {
      numero: "NR-18",
      titulo: "Segurança e Saúde no Trabalho na Indústria da Construção",
      resumo: "Estabelece diretrizes de ordem administrativa, de planejamento e de organização para a construção civil.",
      detalhe: "Inclui PCMAT, medidas de proteção coletiva e individual, andaimes, escavações, movimentação e transporte de materiais, instalações elétricas e muito mais.",
      categoria: "segurança",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-18-nr-18"
    },
    {
      numero: "NR-20",
      titulo: "Segurança e Saúde no Trabalho com Inflamáveis e Combustíveis",
      resumo: "Regulamenta as atividades que envolvem manuseio, armazenamento e comercialização de inflamáveis e combustíveis.",
      detalhe: "Define classificações, requisitos técnicos, capacitação dos trabalhadores e medidas de controle de risco de incêndio e explosão.",
      categoria: "segurança",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-20-nr-20"
    },
    {
      numero: "NR-23",
      titulo: "Proteção Contra Incêndios",
      resumo: "Estabelece as medidas de proteção contra incêndios que devem ser adotadas nos locais de trabalho.",
      detalhe: "Determina saídas de emergência, portas corta-fogo, sistemas de alarme, treinamento de brigada e acesso de bombeiros aos estabelecimentos.",
      categoria: "segurança",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-23-nr-23"
    },
    {
      numero: "NR-35",
      titulo: "Trabalho em Altura",
      resumo: "Estabelece os requisitos mínimos e as medidas de proteção para o trabalho em altura.",
      detalhe: "Todo trabalho realizado acima de 2 metros do nível inferior requer planejamento, autorização, capacitação, equipamentos adequados e supervisão.",
      categoria: "treinamento",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-35-nr-35"
    },
    {
      numero: "NR-36",
      titulo: "Segurança e Saúde no Trabalho em Empresas de Abate e Processamento de Carnes",
      resumo: "Regulamenta as condições de trabalho nas indústrias de abate e processamento de carnes e derivados.",
      detalhe: "Aborda ergonomia, pausas, ritmo de trabalho, temperatura dos ambientes, organização do trabalho e medidas de prevenção de doenças ocupacionais.",
      categoria: "saúde",
      link: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras/normas-regulamentadoras-vigentes/norma-regulamentadora-no-36-nr-36"
    }
  ];

  function renderCards() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filter = document.getElementById('filterSelect').value.toLowerCase();
    const grid = document.getElementById('nrGrid');
    grid.innerHTML = '';

    const filtered = nrs.filter(nr => {
      const matchSearch =
        nr.numero.toLowerCase().includes(search) ||
        nr.titulo.toLowerCase().includes(search) ||
        nr.resumo.toLowerCase().includes(search);
      const matchFilter = filter === '' || nr.categoria === filter;
      return matchSearch && matchFilter;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="no-results">😕 Nenhuma norma encontrada para essa busca.</div>';
      return;
    }

    filtered.forEach(nr => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="nr-number">${nr.numero}</div>
        <h2>${nr.titulo}</h2>
        <p>${nr.resumo}</p>
        <span class="badge">${nr.categoria}</span>
      `;
      card.onclick = () => openModal(nr);
      grid.appendChild(card);
    });
  }

  function openModal(nr) {
    document.getElementById('modalTitle').textContent = nr.titulo;
    document.getElementById('modalLabel').textContent = nr.numero + ' — ' + nr.categoria.toUpperCase();
    document.getElementById('modalDesc').textContent = nr.resumo;
    document.getElementById('modalDetail').textContent = nr.detalhe;
    document.getElementById('modalLink').href = nr.link;
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) {
      document.getElementById('modalOverlay').classList.remove('active');
    }
  }

  function closeModalBtn() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  // Inicializa
  renderCards();
</script>

</body>
</html>
