<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Biblioteca NRs</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .busca-grande{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px 22px;color:#fff;font-size:1rem;outline:none;width:100%;margin-bottom:24px;transition:border .2s}
    .busca-grande::placeholder{color:rgba(255,255,255,.3)}
    .busca-grande:focus{border-color:#00d4ff}
    .nrs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .nr-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;transition:all .2s;cursor:pointer}
    .nr-card:hover{background:rgba(255,255,255,.06);transform:translateY(-2px);border-color:rgba(0,212,255,.3)}
    .nr-numero{font-size:1.4rem;font-weight:900;color:#00d4ff;margin-bottom:6px}
    .nr-nome{font-size:.88rem;font-weight:700;margin-bottom:8px;line-height:1.4}
    .nr-desc{font-size:.75rem;color:rgba(255,255,255,.4);line-height:1.5;margin-bottom:12px}
    .nr-footer{display:flex;justify-content:space-between;align-items:center}
    .nr-status{font-size:.7rem;padding:3px 10px;border-radius:20px;font-weight:700}
    .nr-status.vigente{background:rgba(74,222,128,.15);color:#4ade80}
    .nr-status.revogada{background:rgba(248,113,113,.15);color:#f87171}
    .btn-ver-nr{background:rgba(0,212,255,.1);border:none;border-radius:8px;color:#00d4ff;padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-ver-nr:hover{background:rgba(0,212,255,.2)}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:700px;max-height:92vh;overflow-y:auto}
    .modal-nr-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.08)}
    .modal-nr-num{font-size:2.5rem;font-weight:900;color:#00d4ff}
    .modal-nr-nome{font-size:1.1rem;font-weight:700;margin-bottom:4px}
    .modal-nr-sub{font-size:.8rem;color:rgba(255,255,255,.4)}
    .secao{margin-bottom:20px}
    .secao h4{font-size:.82rem;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,212,255,.12)}
    .secao p,.secao li{font-size:.85rem;color:rgba(255,255,255,.7);line-height:1.7}
    .secao ul{padding-left:18px}
    .secao li{margin-bottom:4px}
    .tag-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .tag{font-size:.72rem;padding:4px 10px;border-radius:6px;background:rgba(0,212,255,.1);color:#00d4ff;border:1px solid rgba(0,212,255,.2)}
    .btn-fechar{padding:12px 28px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s}
    .btn-fechar:hover{background:rgba(255,255,255,.15)}
    .btn-link{padding:12px 24px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;color:#fff;font-size:.88rem;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>📚 Biblioteca de NRs</h2></div>
  </div>
  <input class="busca-grande" type="text" placeholder="🔎 Buscar norma regulamentadora... Ex: NR-6, trabalho em altura, EPI" oninput="renderizar()"/>
  <div class="nrs-grid" id="nrsGrid"></div>
</div>

<div class="modal-overlay" id="modalNr">
  <div class="modal" id="modalNrConteudo"></div>
</div>

<script src="./sidebar.js"></script>
<script>
var nrs=[
  {num:'NR-1',nome:'Disposições Gerais e Gerenciamento de Riscos',desc:'Estabelece as disposições gerais, o campo de aplicação, os termos e definições e as obrigações relativas às Normas Regulamentadoras.',status:'vigente',ministerio:'MTE',temas:['PGR','Gestão de Riscos','Obrigações'],link:'https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadora/normas-regulamentadoras-vigentes/nr-01',detalhes:'A NR-1 foi atualizada em 2020 e passou a incluir o Gerenciamento de Riscos Ocupacionais (GRO) e o Programa de Gerenciamento de Riscos (PGR), substituindo o PPRA. Aplica-se a todos os empregadores e trabalhadores.'},
  {num:'NR-4',nome:'Serviços Especializados em Engenharia de Segurança e em Medicina do Trabalho (SESMT)',desc:'Estabelece a obrigatoriedade das empresas de manter Serviços Especializados em Engenharia de Segurança e Medicina do Trabalho.',status:'vigente',ministerio:'MTE',temas:['SESMT','Engenharia de Segurança','Medicina do Trabalho'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'O SESMT deve ser dimensionado de acordo com o grau de risco da atividade e o número de empregados. Os profissionais integrantes são: médico do trabalho, engenheiro de segurança, técnico de segurança, enfermeiro do trabalho e auxiliar de enfermagem do trabalho.'},
  {num:'NR-5',nome:'Comissão Interna de Prevenção de Acidentes (CIPA)',desc:'Estabelece a obrigatoriedade de organização e manutenção da CIPA nas empresas, com representantes do empregador e dos empregados.',status:'vigente',ministerio:'MTE',temas:['CIPA','Prevenção','Comissão'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'A CIPA tem como objetivo a prevenção de acidentes e doenças decorrentes do trabalho. Os membros representantes dos empregados são eleitos pelos próprios trabalhadores e têm estabilidade de emprego durante o mandato.'},
  {num:'NR-6',nome:'Equipamentos de Proteção Individual (EPI)',desc:'Estabelece a obrigação do fornecimento gratuito de EPIs pelo empregador, requisitos de qualidade (CA), e obrigações do empregado.',status:'vigente',ministerio:'MTE',temas:['EPI','CA','Proteção','Fornecimento'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'O EPI só pode ser posto à venda ou utilizado com indicação do CA (Certificado de Aprovação) expedido pelo MTE. O empregador deve fornecer gratuitamente o EPI adequado ao risco, exigir seu uso e fiscalizar a utilização.'},
  {num:'NR-7',nome:'Programa de Controle Médico de Saúde Ocupacional (PCMSO)',desc:'Estabelece a obrigatoriedade de elaboração e implementação do PCMSO por parte dos empregadores e instituições.',status:'vigente',ministerio:'MTE',temas:['PCMSO','ASO','Saúde Ocupacional','Exames'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'O PCMSO deve incluir a realização obrigatória dos exames: admissional, periódico, de retorno ao trabalho, de mudança de função e demissional. O ASO (Atestado de Saúde Ocupacional) deve ser emitido em duas vias.'},
  {num:'NR-9',nome:'Avaliação e Controle das Exposições Ocupacionais a Agentes Físicos, Químicos e Biológicos',desc:'Trata da identificação, avaliação e controle das exposições ocupacionais a agentes nocivos à saúde.',status:'vigente',ministerio:'MTE',temas:['Agentes Físicos','Agentes Químicos','Biológicos','LTCAT'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Substitui o antigo PPRA a partir de 2022. Estabelece a obrigatoriedade de identificação de perigos e avaliação dos riscos ocupacionais por agentes físicos (ruído, calor, vibração, radiações), químicos e biológicos.'},
  {num:'NR-10',nome:'Segurança em Instalações e Serviços com Eletricidade',desc:'Estabelece os requisitos e condições mínimas objetivando a implementação de medidas de controle e sistemas preventivos para garantir a segurança e saúde dos trabalhadores.',status:'vigente',ministerio:'MTE',temas:['Eletricidade','Instalações Elétricas','Choque Elétrico'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Todo trabalhador que atua em instalações elétricas ou proximidades deve ser habilitado, qualificado e/ou autorizado. O treinamento básico tem carga mínima de 40h e deve ser renovado a cada 2 anos.'},
  {num:'NR-11',nome:'Transporte, Movimentação, Armazenagem e Manuseio de Materiais',desc:'Estabelece requisitos de segurança para operação de elevadores, guindastes, transportadores industriais e máquinas transportadoras.',status:'vigente',ministerio:'MTE',temas:['Transporte','Empilhadeira','Armazenagem'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Inclui regras para operação de empilhadeiras, pontes rolantes, guindastes, transportadores de correia e demais equipamentos de movimentação de materiais.'},
  {num:'NR-12',nome:'Segurança no Trabalho em Máquinas e Equipamentos',desc:'Define referências técnicas, princípios fundamentais e medidas de proteção para garantir a saúde e integridade física dos trabalhadores.',status:'vigente',ministerio:'MTE',temas:['Máquinas','Equipamentos','Proteções','Prensas'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Exige medidas de proteção coletiva em máquinas: proteções fixas e móveis, dispositivos de parada de emergência, distâncias de segurança. As máquinas devem possuir Declaração de Conformidade e manual em português.'},
  {num:'NR-13',nome:'Vasos de Pressão, Caldeiras, Tubulações e Tanques Metálicos',desc:'Estabelece requisitos mínimos para gestão da integridade estrutural de caldeiras a vapor, vasos de pressão, tubulações e tanques.',status:'vigente',ministerio:'MTE',temas:['Caldeiras','Vasos de Pressão','Inspeção'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Caldeiras e vasos de pressão devem ter prontuário, placa de identificação, válvulas de segurança e serem inspecionados periodicamente por Profissional Habilitado (PH).'},
  {num:'NR-15',nome:'Atividades e Operações Insalubres',desc:'Define as atividades, operações e agentes insalubres, estabelecendo os limites de tolerância e os critérios para caracterização e classificação da insalubridade.',status:'vigente',ministerio:'MTE',temas:['Insalubridade','Ruído','Calor','Adicional'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'O adicional de insalubridade é de 40% (grau máximo), 20% (grau médio) ou 10% (grau mínimo) sobre o salário mínimo nacional. A eliminação ou neutralização da insalubridade extingue o adicional.'},
  {num:'NR-16',nome:'Atividades e Operações Perigosas',desc:'Regulamenta as atividades e operações perigosas com inflamáveis, explosivos, energia elétrica, roubos e outras ofensas à integridade física.',status:'vigente',ministerio:'MTE',temas:['Periculosidade','Adicional','Inflamáveis','Explosivos'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'O adicional de periculosidade é de 30% sobre o salário básico. As atividades e operações perigosas com exposição permanente a inflamáveis, explosivos, energia elétrica e outros agentes geram direito ao adicional.'},
  {num:'NR-17',nome:'Ergonomia',desc:'Visa estabelecer parâmetros que permitam a adaptação das condições de trabalho às características psicofisiológicas dos trabalhadores.',status:'vigente',ministerio:'MTE',temas:['Ergonomia','AET','Postura','Telemarketing'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Abrange levantamento e transporte de cargas, mobiliário, equipamentos, condições ambientais e organização do trabalho. A Análise Ergonômica do Trabalho (AET) é recomendada para identificar e corrigir problemas ergonômicos.'},
  {num:'NR-18',nome:'Segurança e Saúde no Trabalho na Indústria da Construção',desc:'Estabelece diretrizes de ordem administrativa, de planejamento e de organização que objetivam a implementação de medidas de controle e sistemas preventivos de segurança nos processos, nas condições e no meio ambiente de trabalho na Indústria da Construção.',status:'vigente',ministerio:'MTE',temas:['Construção Civil','Andaimes','PCMAT'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Obras com 20 ou mais trabalhadores devem ter PCMAT (Programa de Condições e Meio Ambiente de Trabalho na Indústria da Construção). Exige proteções coletivas contra quedas e uso de EPIs específicos.'},
  {num:'NR-20',nome:'Segurança e Saúde no Trabalho com Inflamáveis e Combustíveis',desc:'Estabelece requisitos mínimos para a gestão da segurança e saúde no trabalho contra os fatores de risco de acidentes em atividades laborais com inflamáveis e combustíveis líquidos e gasosos.',status:'vigente',ministerio:'MTE',temas:['Inflamáveis','Combustíveis','Postos de Gasolina'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Classifica os trabalhadores como Operadores (treinamento de 20h) e Supervisores (treinamento de 40h). Estabelece requisitos para manuseio, armazenamento e transferência de produtos inflamáveis.'},
  {num:'NR-23',nome:'Proteção Contra Incêndios',desc:'Estabelece as medidas de proteção contra incêndios que devem ter os locais de trabalho.',status:'vigente',ministerio:'MTE',temas:['Incêndio','Extintores','Saídas de Emergência','Brigada'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Os locais de trabalho devem dispor de saídas em número suficiente e de largura adequada para a rápida saída dos trabalhadores. Os extintores devem ser inspecionados anualmente e recarregados conforme necessário.'},
  {num:'NR-24',nome:'Condições Sanitárias e de Conforto nos Locais de Trabalho',desc:'Regulamenta as condições sanitárias mínimas de banheiros, vestiários, bebedouros, refeitórios e alojamentos.',status:'vigente',ministerio:'MTE',temas:['Sanitários','Refeitório','Vestiário','Conforto'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Define proporções mínimas de instalações sanitárias por número de trabalhadores, requisitos para vestiários, refeitórios, bebedouros e cozinhas em locais de trabalho.'},
  {num:'NR-25',nome:'Resíduos Industriais',desc:'Regulamenta o destino dos resíduos industriais, proibindo o lançamento de resíduos em locais não autorizados.',status:'vigente',ministerio:'MTE',temas:['Resíduos','Meio Ambiente','Descarte'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Os resíduos industriais líquidos, sólidos e gasosos devem ter destino adequado. É proibido o lançamento de efluentes ou resíduos em locais não autorizados pelos órgãos competentes.'},
  {num:'NR-33',nome:'Segurança e Saúde nos Trabalhos em Espaços Confinados',desc:'Estabelece os requisitos mínimos para identificação de espaços confinados e o reconhecimento, avaliação, monitoramento e controle dos riscos existentes.',status:'vigente',ministerio:'MTE',temas:['Espaços Confinados','Atmosfera','Vigilante','Supervisor'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Todo trabalho em espaço confinado exige: Supervisor de Entrada, Vigia e Trabalhador Autorizado, todos devidamente treinados. É obrigatória a emissão de Permissão de Entrada e Trabalho (PET).'},
  {num:'NR-35',nome:'Trabalho em Altura',desc:'Estabelece os requisitos mínimos e as medidas de proteção para o trabalho em altura, envolvendo o planejamento, a organização e a execução.',status:'vigente',ministerio:'MTE',temas:['Trabalho em Altura','Queda','Talabarte','Cinto'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Considera trabalho em altura toda atividade executada acima de 2,0 m do nível inferior. O trabalhador deve ser treinado (mínimo 8h teóricas e 8h práticas) e passar por avaliação clínica. A renovação é a cada 2 anos.'},
  {num:'NR-36',nome:'Segurança e Saúde no Trabalho em Empresas de Abate e Processamento de Carnes',desc:'Estabelece os requisitos mínimos de segurança e saúde no trabalho para as empresas do setor frigorífico.',status:'vigente',ministerio:'MTE',temas:['Frigorífico','Abate','Frio','Ergonomia'],link:'https://www.gov.br/trabalho-e-emprego',detalhes:'Abrange frigoríficos e indústrias de processamento de carnes. Estabelece pausas obrigatórias, limites de frio, exigências ergonômicas e programas de saúde específicos para o setor.'}
];
function renderizar(){
  var busca=document.querySelector('.busca-grande').value.toLowerCase();
  var grid=document.getElementById('nrsGrid');
  var filtrados=nrs.filter(function(n){
    return !busca||n.num.toLowerCase().includes(busca)||n.nome.toLowerCase().includes(busca)||n.desc.toLowerCase().includes(busca)||n.temas.join(' ').toLowerCase().includes(busca);
  });
  grid.innerHTML='';
  if(filtrados.length===0){grid.innerHTML='<div class="empty-state"><div>📚</div><p>Nenhuma NR encontrada para "'+document.querySelector('.busca-grande').value+'"</p></div>';return;}
  filtrados.forEach(function(n){
    var div=document.createElement('div');
    div.className='nr-card';
    div.innerHTML=
      '<div class="nr-numero">'+n.num+'</div>'+
      '<div class="nr-nome">'+n.nome+'</div>'+
      '<div class="nr-desc">'+n.desc+'</div>'+
      '<div class="nr-footer">'+
        '<span class="nr-status '+n.status+'">'+n.status+'</span>'+
        '<button class="btn-ver-nr" onclick="verNr(\''+n.num+'\')">Ver detalhes →</button>'+
      '</div>';
    grid.appendChild(div);
  });
}
function verNr(num){
  var n=nrs.find(function(x){return x.num===num;});
  if(!n)return;
  document.getElementById('modalNrConteudo').innerHTML=
    '<div class="modal-nr-header">'+
      '<div class="modal-nr-num">'+n.num+'</div>'+
      '<div><div class="modal-nr-nome">'+n.nome+'</div><div class="modal-nr-sub">Ministério do Trabalho e Emprego · <span class="nr-status '+n.status+'" style="display:inline">'+n.status+'</span></div></div>'+
    '</div>'+
    '<div class="secao"><h4>Descrição</h4><p>'+n.desc+'</p></div>'+
    '<div class="secao"><h4>Detalhes</h4><p>'+n.detalhes+'</p></div>'+
    '<div class="secao"><h4>Temas Abordados</h4><div class="tag-group">'+n.temas.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div></div>'+
    '<div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px">'+
      '<button class="btn-fechar" onclick="fecharNr()">Fechar</button>'+
      '<button class="btn-link" onclick="window.open(\''+n.link+'\',\'_blank\')">🔗 Ver no Portal MTE</button>'+
    '</div>';
  document.getElementById('modalNr').classList.add('open');
}
function fecharNr(){document.getElementById('modalNr').classList.remove('open');}
document.getElementById('modalNr').addEventListener('click',function(e){if(e.target===this)fecharNr();});
renderizar();
</script>
</body>
</html>
