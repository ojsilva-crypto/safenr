<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Biblioteca NRs</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}

    /* TOPBAR */
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar-acoes{display:flex;align-items:center;gap:10px}
    .btn-atualizar{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);border-radius:10px;color:#00d4ff;padding:9px 18px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
    .btn-atualizar:hover{background:rgba(0,212,255,.22)}
    .btn-atualizar.girando svg{animation:girar 1s linear infinite}
    @keyframes girar{to{transform:rotate(360deg)}}

    /* BANNER ATUALIZAÇÃO */
    .banner-update{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(239,68,68,.1));border:1px solid rgba(245,158,11,.4);border-radius:14px;padding:16px 22px;margin-bottom:20px;display:none;align-items:flex-start;gap:14px}
    .banner-update.show{display:flex}
    .banner-update-icon{font-size:1.8rem;flex-shrink:0}
    .banner-update-txt h4{color:#fbbf24;font-size:.95rem;margin-bottom:4px}
    .banner-update-txt p{font-size:.8rem;color:rgba(255,255,255,.6);line-height:1.5}
    .banner-update-txt ul{font-size:.8rem;color:rgba(255,255,255,.6);padding-left:18px;margin-top:6px}
    .banner-update-txt ul li{margin-bottom:2px}
    .btn-fechar-banner{background:none;border:none;color:rgba(255,255,255,.4);font-size:1.2rem;cursor:pointer;margin-left:auto;flex-shrink:0;align-self:flex-start}

    /* STATS */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
    .stat-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 20px;text-align:center}
    .stat-num{font-size:1.8rem;font-weight:900;color:#00d4ff}
    .stat-label{font-size:.72rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

    /* FILTROS */
    .filtros-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .busca-grande{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 18px;color:#fff;font-size:.95rem;outline:none;flex:1;min-width:220px;transition:border .2s}
    .busca-grande::placeholder{color:rgba(255,255,255,.3)}
    .busca-grande:focus{border-color:#00d4ff}
    .select-filtro{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;color:#fff;font-size:.85rem;outline:none;cursor:pointer}
    .select-filtro option{background:#0f1923}

    /* GRID */
    .nrs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .nr-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;transition:all .25s;cursor:pointer;position:relative;overflow:hidden}
    .nr-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00d4ff,#0099cc);opacity:0;transition:opacity .25s}
    .nr-card:hover{background:rgba(255,255,255,.06);transform:translateY(-3px);border-color:rgba(0,212,255,.3)}
    .nr-card:hover::before{opacity:1}
    .nr-card.tem-update{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.04)}
    .nr-card.tem-update::before{background:linear-gradient(90deg,#f59e0b,#ef4444);opacity:1}
    .badge-update{position:absolute;top:12px;right:12px;background:#f59e0b;color:#000;font-size:.6rem;font-weight:900;padding:2px 8px;border-radius:20px;text-transform:uppercase}
    .nr-numero{font-size:1.4rem;font-weight:900;color:#00d4ff;margin-bottom:6px}
    .nr-nome{font-size:.88rem;font-weight:700;margin-bottom:8px;line-height:1.4}
    .nr-desc{font-size:.75rem;color:rgba(255,255,255,.4);line-height:1.5;margin-bottom:14px}
    .nr-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    .nr-status{font-size:.7rem;padding:3px 10px;border-radius:20px;font-weight:700}
    .nr-status.vigente{background:rgba(74,222,128,.15);color:#4ade80}
    .nr-status.revogada{background:rgba(248,113,113,.15);color:#f87171}
    .nr-status.revisao{background:rgba(251,191,36,.15);color:#fbbf24}
    .btn-ver-nr{background:rgba(0,212,255,.1);border:none;border-radius:8px;color:#00d4ff;padding:7px 14px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s}
    .btn-ver-nr:hover{background:rgba(0,212,255,.22)}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}

    /* ÚLTIMA VERIFICAÇÃO */
    .ultima-verif{font-size:.72rem;color:rgba(255,255,255,.3);text-align:right;margin-bottom:14px}

    /* MODAL */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0d1a27;border:1px solid rgba(255,255,255,.1);border-radius:20px;width:100%;max-width:780px;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column}
    .modal-header{padding:28px 32px 20px;border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;background:#0d1a27;z-index:1}
    .modal-nr-header{display:flex;align-items:center;gap:16px}
    .modal-nr-num{font-size:2.4rem;font-weight:900;color:#00d4ff;min-width:80px}
    .modal-nr-nome{font-size:1.05rem;font-weight:700;margin-bottom:4px;line-height:1.3}
    .modal-nr-sub{font-size:.78rem;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
    .modal-body{padding:24px 32px;flex:1}
    .secao{margin-bottom:22px}
    .secao h4{font-size:.78rem;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid rgba(0,212,255,.12);display:flex;align-items:center;gap:6px}
    .secao p,.secao li{font-size:.84rem;color:rgba(255,255,255,.7);line-height:1.75}
    .secao ul,.secao ol{padding-left:20px}
    .secao li{margin-bottom:5px}
    .secao strong{color:rgba(255,255,255,.9)}
    .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:4px}
    .info-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px 16px}
    .info-item label{font-size:.68rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
    .info-item span{font-size:.85rem;color:#fff;font-weight:600}
    .tag-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .tag{font-size:.72rem;padding:4px 12px;border-radius:6px;background:rgba(0,212,255,.1);color:#00d4ff;border:1px solid rgba(0,212,255,.2)}
    .modal-footer{padding:18px 32px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:12px;justify-content:flex-end;background:#0d1a27;position:sticky;bottom:0}
    .btn-fechar{padding:11px 24px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:.88rem;cursor:pointer;transition:all .2s}
    .btn-fechar:hover{background:rgba(255,255,255,.14)}
    .btn-link{padding:11px 22px;border-radius:10px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;color:#fff;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

    /* TABS MODAL */
    .modal-tabs{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,.04);border-radius:10px;padding:4px}
    .modal-tab{flex:1;padding:8px;border:none;background:none;color:rgba(255,255,255,.4);font-size:.8rem;font-weight:600;cursor:pointer;border-radius:8px;transition:all .2s;text-align:center}
    .modal-tab.active{background:rgba(0,212,255,.15);color:#00d4ff}
    .tab-pane{display:none}
    .tab-pane.active{display:block}

    /* CHANGELOG */
    .changelog-item{background:rgba(255,255,255,.03);border-radius:10px;padding:14px;margin-bottom:10px;border-left:3px solid #00d4ff}
    .changelog-item.update{border-left-color:#f59e0b}
    .changelog-data{font-size:.72rem;color:rgba(255,255,255,.35);margin-bottom:4px}
    .changelog-titulo{font-size:.85rem;font-weight:700;color:#fff;margin-bottom:4px}
    .changelog-desc{font-size:.78rem;color:rgba(255,255,255,.5);line-height:1.5}

    /* PENALIDADES */
    .penalidade-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:14px;margin-top:8px}
    .penalidade-box h5{color:#f87171;font-size:.8rem;margin-bottom:6px}
    .penalidade-box p{font-size:.8rem;color:rgba(255,255,255,.6);line-height:1.5}

    /* RESPONSIVO */
    @media(max-width:900px){.nrs-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){
      .main{margin-left:0;padding:80px 16px 24px}
      .nrs-grid{grid-template-columns:1fr}
      .stats-row{grid-template-columns:repeat(2,1fr)}
      .info-grid{grid-template-columns:1fr}
      .modal-body{padding:16px 18px}
      .modal-header{padding:18px 18px 14px}
      .modal-footer{padding:14px 18px}
    }
  </style>
</head>
<body>
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <div><h2>📚 Biblioteca de NRs</h2><div style="font-size:.78rem;color:rgba(255,255,255,.35);margin-top:3px">Normas Regulamentadoras do Ministério do Trabalho e Emprego</div></div>
    <div class="topbar-acoes">
      <button class="btn-atualizar" id="btnVerificar" onclick="verificarAtualizacoes(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Verificar Atualizações
      </button>
    </div>
  </div>

  <!-- BANNER ATUALIZAÇÃO -->
  <div class="banner-update" id="bannerUpdate">
    <div class="banner-update-icon">🔔</div>
    <div class="banner-update-txt">
      <h4 id="bannerTitulo">Atualizações Disponíveis!</h4>
      <p id="bannerDesc">Novas versões de normas foram identificadas.</p>
      <ul id="bannerLista"></ul>
    </div>
    <button class="btn-fechar-banner" onclick="fecharBanner()">✕</button>
  </div>

  <!-- ÚLTIMA VERIFICAÇÃO -->
  <div class="ultima-verif" id="ultimaVerif">Última verificação: nunca</div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total de NRs</div></div>
    <div class="stat-card"><div class="stat-num" id="statVigentes" style="color:#4ade80">0</div><div class="stat-label">Vigentes</div></div>
    <div class="stat-card"><div class="stat-num" id="statRevisao" style="color:#fbbf24">0</div><div class="stat-label">Em Revisão</div></div>
    <div class="stat-card"><div class="stat-num" id="statRevogadas" style="color:#f87171">0</div><div class="stat-label">Revogadas</div></div>
  </div>

  <!-- FILTROS -->
  <div class="filtros-row">
    <input class="busca-grande" type="text" id="campoBusca" placeholder="🔎  Buscar NR... Ex: NR-6, trabalho em altura, EPI, CIPA" oninput="renderizar()"/>
    <select class="select-filtro" id="filtroStatus" onchange="renderizar()">
      <option value="">Todos os status</option>
      <option value="vigente">✅ Vigentes</option>
      <option value="revisao">🔄 Em Revisão</option>
      <option value="revogada">❌ Revogadas</option>
    </select>
    <select class="select-filtro" id="filtroArea" onchange="renderizar()">
      <option value="">Todas as áreas</option>
      <option value="Saúde">🏥 Saúde</option>
      <option value="Equipamento">⚙️ Equipamentos</option>
      <option value="Construção">🏗️ Construção</option>
      <option value="Elétrica">⚡ Elétrica</option>
      <option value="Química">🧪 Química</option>
      <option value="Ergonomia">🪑 Ergonomia</option>
    </select>
  </div>

  <div class="nrs-grid" id="nrsGrid"></div>
</div>

<!-- MODAL DETALHE NR -->
<div class="modal-overlay" id="modalNr">
  <div class="modal" id="modalNrConteudo"></div>
</div>

<script src="./sidebar.js"></script>

var ATUALIZACOES_SIMULADAS = [
  { nr:'NR-1', data:'2024-03', descricao:'Revisão dos prazos do PGR para 2024 — Portaria MTE nº 595/2024' },
  { nr:'NR-5', data:'2024-01', descricao:'Novas diretrizes para prevenção de assédio na CIPA — Portaria MTE nº 1.357/2023 em vigor' },
  { nr:'NR-17', data:'2024-02', descricao:'Novos parâmetros ergonômicos para trabalho remoto — Instrução Normativa 2024' },
  { nr:'NR-35', data:'2024-03', descricao:'Atualização dos requisitos de ancoragem para coberturas metálicas' }
];

function verificarAtualizacoes(forçar) {
  var btn = document.getElementById('btnVerificar');
  btn.classList.add('girando');
  btn.disabled = true;

  var ultima = localStorage.getItem('safenr_nr_ultima_verif');
  var hoje = new Date();

  // Verificar se passou 30 dias
  if (!forçar && ultima) {
    var diff = (hoje - new Date(ultima)) / (1000 * 60 * 60 * 24);
    if (diff < 30) {
      atualizarUltimaVerif(new Date(ultima));
      btn.classList.remove('girando');
      btn.disabled = false;
      return;
    }
  }

  // Simular verificação com delay (em produção, faria fetch para API do gov.br)
  setTimeout(function() {
    localStorage.setItem('safenr_nr_ultima_verif', hoje.toISOString());
    atualizarUltimaVerif(hoje);

    // Verificar se há atualizações novas desde última verificação
    var ultimaData = ultima ? new Date(ultima) : new Date('2024-01-01');
    var novas = ATUALIZACOES_SIMULADAS.filter(function(a) {
      return new Date(a.data + '-01') > ultimaData || forçar;
    });

    if (novas.length > 0 || forçar) {
      mostrarBannerAtualizacoes(novas.length > 0 ? novas : ATUALIZACOES_SIMULADAS);
    }

    btn.classList.remove('girando');
    btn.disabled = false;
    renderizar();
  }, 1800);
}

function mostrarBannerAtualizacoes(novas) {
  var banner = document.getElementById('bannerUpdate');
  var lista = document.getElementById('bannerLista');
  var titulo = document.getElementById('bannerTitulo');
  var desc = document.getElementById('bannerDesc');

  titulo.textContent = '🔔 ' + novas.length + ' atualização(ões) identificada(s) nas NRs!';
  desc.textContent = 'As seguintes normas podem ter sofrido alterações recentes. Verifique no Portal do MTE:';
  lista.innerHTML = '';
  novas.forEach(function(a) {
    var li = document.createElement('li');
    li.textContent = a.nr + ' — ' + a.descricao;
    lista.appendChild(li);
  });

  banner.classList.add('show');

  // Marcar os cards afetados
  novas.forEach(function(a) {
    NRS.forEach(function(nr) {
      if (nr.num === a.nr) nr._temUpdate = true;
    });
  });
}

function fecharBanner() {
  document.getElementById('bannerUpdate').classList.remove('show');
}

function atualizarUltimaVerif(data) {
  var el = document.getElementById('ultimaVerif');
  el.textContent = 'Última verificação: ' + data.toLocaleDateString('pt-BR') + ' às ' + data.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

// Verificar automaticamente ao carregar (sem forçar)
function verificarAutoInicio() {
  var ultima = localStorage.getItem('safenr_nr_ultima_verif');
  if (ultima) {
    var diff = (new Date() - new Date(ultima)) / (1000 * 60 * 60 * 24);
    atualizarUltimaVerif(new Date(ultima));
    if (diff >= 30) {
      verificarAtualizacoes(false);
    }
  } else {
    // Primeira vez
    verificarAtualizacoes(false);
  }
}

// ============================================================
// RENDERIZAÇÃO
// ============================================================
function renderizar() {
  var busca = document.getElementById('campoBusca').value.toLowerCase();
  var filtroStatus = document.getElementById('filtroStatus').value;
  var filtroArea = document.getElementById('filtroArea').value;
  var grid = document.getElementById('nrsGrid');

  var filtrados = NRS.filter(function(n) {
    var okBusca = !busca || n.num.toLowerCase().includes(busca) || n.nome.toLowerCase().includes(busca) || n.desc.toLowerCase().includes(busca) || n.temas.join(' ').toLowerCase().includes(busca);
    var okStatus = !filtroStatus || n.status === filtroStatus;
    var okArea = !filtroArea || n.area === filtroArea;
    return okBusca && okStatus && okArea;
  });

  // Atualizar stats
  document.getElementById('statTotal').textContent = NRS.length;
  document.getElementById('statVigentes').textContent = NRS.filter(function(n){return n.status==='vigente';}).length;
  document.getElementById('statRevisao').textContent = NRS.filter(function(n){return n.status==='revisao';}).length;
  document.getElementById('statRevogadas').textContent = NRS.filter(function(n){return n.status==='revogada';}).length;

  grid.innerHTML = '';
  if (filtrados.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div>📚</div><p>Nenhuma NR encontrada.</p></div>';
    return;
  }

  filtrados.forEach(function(n) {
    var div = document.createElement('div');
    div.className = 'nr-card' + (n._temUpdate ? ' tem-update' : '');
    div.innerHTML =
      (n._temUpdate ? '<span class="badge-update">Atualização</span>' : '') +
      '<div class="nr-numero">' + n.num + '</div>' +
      '<div class="nr-nome">' + n.nome + '</div>' +
      '<div class="nr-desc">' + n.desc + '</div>' +
      '<div class="nr-footer">' +
        '<span class="nr-status ' + n.status + '">' + n.status.charAt(0).toUpperCase() + n.status.slice(1) + '</span>' +
        '<button class="btn-ver-nr" onclick="verNr(\'' + n.num + '\')">Ver conteúdo →</button>' +
      '</div>';
    grid.appendChild(div);
  });
}

// ============================================================
// MODAL DETALHE
// ============================================================
function verNr(num) {
  var n = NRS.find(function(x){return x.num===num;});
  if (!n) return;

  var empLi = n.obrigacoesEmpregador.map(function(o){return '<li>'+o+'</li>';}).join('');
  var trabLi = n.obrigacoesTrabalhador.map(function(o){return '<li>'+o+'</li>';}).join('');
  var ptLi = n.pontosPrincipais.map(function(o){return '<li>'+o+'</li>';}).join('');
  var tags = n.temas.map(function(t){return '<span class="tag">'+t+'</span>';}).join('');
  var changelogHTML = n.changelog.map(function(c){
    return '<div class="changelog-item '+c.tipo+'"><div class="changelog-data">'+c.data+'</div><div class="changelog-titulo">'+c.titulo+'</div><div class="changelog-desc">'+c.desc+'</div></div>';
  }).join('');

  document.getElementById('modalNrConteudo').innerHTML =
    '<div class="modal-header">' +
      '<div class="modal-nr-header">' +
        '<div class="modal-nr-num">' + n.num + '</div>' +
        '<div>' +
          '<div class="modal-nr-nome">' + n.nome + '</div>' +
          '<div class="modal-nr-sub">' +
            '<span class="nr-status ' + n.status + '">' + n.status + '</span>' +
            '<span>· MTE · Publicação: ' + n.publicacao + '</span>' +
            '<span>· Última atualização: ' + n.ultimaAtualizacao + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-body">' +
      '<div class="info-grid">' +
        '<div class="info-item"><label>Portaria Vigente</label><span>' + n.portaria + '</span></div>' +
        '<div class="info-item"><label>Área de Aplicação</label><span>' + n.area + '</span></div>' +
      '</div>' +
      '<br>' +
      '<div class="modal-tabs">' +
        '<button class="modal-tab active" onclick="trocarTab(this,\'aba-objetivo\')">🎯 Objetivo</button>' +
        '<button class="modal-tab" onclick="trocarTab(this,\'aba-obrig\')">📋 Obrigações</button>' +
        '<button class="modal-tab" onclick="trocarTab(this,\'aba-pontos\')">⭐ Pontos-chave</button>' +
        '<button class="modal-tab" onclick="trocarTab(this,\'aba-hist\')">🕐 Histórico</button>' +
      '</div>' +
      '<div id="aba-objetivo" class="tab-pane active">' +
        '<div class="secao"><h4>📌 Objetivo da Norma</h4><p>' + n.objetivo + '</p></div>' +
        '<div class="secao"><h4>🏷️ Temas Abordados</h4><div class="tag-group">' + tags + '</div></div>' +
        '<div class="penalidade-box"><h5>⚖️ Penalidades por Descumprimento</h5><p>' + n.penalidades + '</p></div>' +
      '</div>' +
      '<div id="aba-obrig" class="tab-pane">' +
        '<div class="secao"><h4>🏢 Obrigações do Empregador</h4><ul>' + empLi + '</ul></div>' +
        '<div class="secao"><h4>👷 Obrigações do Trabalhador</h4><ul>' + trabLi + '</ul></div>' +
      '</div>' +
      '<div id="aba-pontos" class="tab-pane">' +
        '<div class="secao"><h4>⭐ Principais Pontos da Norma</h4><ul>' + ptLi + '</ul></div>' +
      '</div>' +
      '<div id="aba-hist" class="tab-pane">' +
        '<div class="secao"><h4>🕐 Histórico de Alterações</h4>' + changelogHTML + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn-fechar" onclick="fecharNr()">Fechar</button>' +
      '<a class="btn-link" href="' + n.link + '" target="_blank" rel="noopener">🔗 Ver no Portal MTE</a>' +
    '</div>';

  document.getElementById('modalNr').classList.add('open');
}

function trocarTab(btn, id) {
  document.querySelectorAll('.modal-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function fecharNr() { document.getElementById('modalNr').classList.remove('open'); }
document.getElementById('modalNr').addEventListener('click', function(e){if(e.target===this)fecharNr();});

// INIT
renderizar();
verificarAutoInicio();
</script>
</body>
</html>
