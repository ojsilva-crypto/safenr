<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Cadastro de EPIs</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#fb923c,#ea580c);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(251,146,60,.12);border-color:#fb923c;color:#fb923c}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#fb923c}
    .tabela-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead tr{background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
    th{padding:14px 18px;text-align:left;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.5px}
    td{padding:14px 18px;font-size:.87rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
    .badge.disponivel{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.em-uso{background:rgba(96,165,250,.15);color:#60a5fa}
    .badge.vencido{background:rgba(248,113,113,.15);color:#f87171}
    .badge.a-vencer{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.descartado{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .btn-acao{background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:.85rem;transition:background .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08)}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3)}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#fb923c}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:60px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .secao-titulo{font-size:.78rem;font-weight:800;color:#fb923c;text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(251,146,60,.15)}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#ea580c);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .detalhe-row{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .detalhe-row:last-child{border-bottom:none}
    .detalhe-label{font-size:.78rem;color:rgba(255,255,255,.4);min-width:160px;font-weight:600}
    .detalhe-valor{font-size:.88rem;color:#fff;flex:1}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>🦺 Cadastro de EPIs</h2><span id="totalRegistros">0 registros</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo EPI</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-disponivel" style="color:#4ade80">0</div>
      <div class="rc-label">Disponíveis</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-emuso" style="color:#60a5fa">0</div>
      <div class="rc-label">Em Uso</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-vencido" style="color:#f87171">0</div>
      <div class="rc-label">Vencidos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-avencer" style="color:#fbbf24">0</div>
      <div class="rc-label">Vencem em 30d</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"  onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-disp"  onclick="filtrar('disponivel',this)">✅ Disponível</button>
    <button class="filtro-btn" id="fb-uso"   onclick="filtrar('em-uso',this)">🔵 Em Uso</button>
    <button class="filtro-btn" id="fb-venc"  onclick="filtrar('vencido',this)">🔴 Vencidos</button>
    <button class="filtro-btn" id="fb-desc"  onclick="filtrar('descartado',this)">⚫ Descartados</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar EPI..." oninput="renderizar(getLista())"/>
  </div>
  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Nome do EPI</th><th>CA Nº</th><th>Categoria</th><th>Colaborador</th>
          <th>Qtd Estoque</th><th>Validade</th><th>Status</th><th>Registrado por</th><th>Acoes</th>
        </tr>
      </thead>
      <tbody id="tabelaBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <div>🦺</div>
      <p>Nenhum EPI cadastrado.<br>Clique em <strong>+ Novo EPI</strong>.</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">🦺 Novo EPI</h3>
    <div class="secao-titulo">Identificação</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Nome do EPI *</label>
        <input type="text" id="f_nome" placeholder="Ex: Capacete de Segurança Classe B"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Número do CA *</label>
        <input type="text" id="f_ca" placeholder="Ex: 12345"/>
      </div>
      <div class="form-group">
        <label>Categoria / Tipo</label>
        <select id="f_categoria">
          <option value="protecao-cabeca">Proteção da Cabeça</option>
          <option value="protecao-olhos">Proteção dos Olhos/Face</option>
          <option value="protecao-auditiva">Proteção Auditiva</option>
          <option value="protecao-respiratoria">Proteção Respiratória</option>
          <option value="protecao-maos">Proteção das Mãos</option>
          <option value="protecao-pes">Proteção dos Pés</option>
          <option value="protecao-corpo">Proteção do Corpo/Tronco</option>
          <option value="protecao-queda">Proteção contra Quedas</option>
          <option value="outro">Outro</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fabricante</label>
        <input type="text" id="f_fab" placeholder="Ex: 3M, Proteplus"/>
      </div>
      <div class="form-group">
        <label>Modelo / Referência</label>
        <input type="text" id="f_modelo" placeholder="Ex: H700"/>
      </div>
    </div>
    <div class="secao-titulo">Estoque e Validade</div>
    <div class="form-row">
      <div class="form-group">
        <label>Quantidade em Estoque</label>
        <input type="number" id="f_qtd" placeholder="Ex: 10" min="0"/>
      </div>
      <div class="form-group">
        <label>Estoque Mínimo</label>
        <input type="number" id="f_qtdMin" placeholder="Ex: 3" min="0"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data de Validade do CA</label>
        <input type="date" id="f_validade"/>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f_status">
          <option value="disponivel">Disponível</option>
          <option value="em-uso">Em Uso</option>
          <option value="vencido">Vencido</option>
          <option value="descartado">Descartado</option>
        </select>
      </div>
    </div>
    <div class="secao-titulo">Colaborador / Entrega</div>
    <div class="form-row">
      <div class="form-group">
        <label>Colaborador (se entregue)</label>
        <input type="text" id="f_colab" list="listaColabsEpi" placeholder="Nome do colaborador"/>
        <datalist id="listaColabsEpi"></datalist>
      </div>
      <div class="form-group">
        <label>Data de Entrega</label>
        <input type="date" id="f_entrega"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observações</label>
        <textarea id="f_obs" placeholder="Informações adicionais..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalVer">
  <div class="modal">
    <h3>🦺 Detalhes do EPI</h3>
    <div id="modalVerConteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharVer()">Fechar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_epis')||'[]');
var editandoId=null,filtroAtivo='';
function salvarStorage(){localStorage.setItem('safenr_epis',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function isVencido(d){return d&&new Date(d+'T00:00:00')<new Date();}
function venceEm30(d){if(!d)return false;var diff=(new Date(d+'T00:00:00')-new Date())/86400000;return diff>=0&&diff<=30;}
function getStatusCA(d,s){if(s==='descartado')return{cls:'descartado',label:'Descartado'};if(isVencido(d))return{cls:'vencido',label:'Vencido'};if(venceEm30(d))return{cls:'a-vencer',label:'A Vencer'};return{cls:s||'disponivel',label:s||'disponivel'};}
function carregarColabs(){var c=JSON.parse(localStorage.getItem('safenr_colaboradores')||'[]');var dl=document.getElementById('listaColabsEpi');if(dl)dl.innerHTML=c.map(function(x){return '<option value="'+x.nome+'"/>';}).join('');}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    var s=getStatusCA(r.validade,r.status);
    if(filtroAtivo&&s.cls!==filtroAtivo)return false;
    if(busca&&!(r.nome||'').toLowerCase().includes(busca)&&!(r.ca||'').toLowerCase().includes(busca)&&!(r.colaborador||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function atualizarContadores(){
  document.getElementById('cnt-disponivel').textContent=registros.filter(function(r){return getStatusCA(r.validade,r.status).cls==='disponivel';}).length;
  document.getElementById('cnt-emuso').textContent=registros.filter(function(r){return r.status==='em-uso';}).length;
  document.getElementById('cnt-vencido').textContent=registros.filter(function(r){return isVencido(r.validade);}).length;
  document.getElementById('cnt-avencer').textContent=registros.filter(function(r){return venceEm30(r.validade)&&!isVencido(r.validade);}).length;
  document.getElementById('totalRegistros').textContent=registros.length+' registro(s)';
}
function renderizar(lista){
  var tbody=document.getElementById('tabelaBody');
  var empty=document.getElementById('emptyState');
  tbody.innerHTML='';atualizarContadores();
  if(lista.length===0){empty.style.display='block';return;}
  empty.style.display='none';
  lista.forEach(function(r){
    var sc=getStatusCA(r.validade,r.status);
    var qtdColor=r.qtdMin&&r.qtd<=r.qtdMin?'#f87171':'#fff';
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td style="color:rgba(255,255,255,.3);font-size:.8rem">#'+String(r.id).padStart(3,'0')+'</td>'+
      '<td><strong>'+(r.nome||'--')+'</strong></td>'+
      '<td style="font-size:.82rem;color:#00d4ff">CA '+(r.ca||'--')+'</td>'+
      '<td style="font-size:.8rem">'+(r.categoria||'--')+'</td>'+
      '<td>'+(r.colaborador||'<span style="color:rgba(255,255,255,.3)">—</span>')+'</td>'+
      '<td style="text-align:center;color:'+qtdColor+';font-weight:700">'+(r.qtd!==undefined?r.qtd:'--')+'</td>'+
      '<td>'+fmt(r.validade)+'</td>'+
      '<td><span class="badge '+sc.cls+'">'+sc.label+'</span></td>'+
      '<td style="font-size:.82rem">👤 '+(r.registradoPor||'--')+'</td>'+
      '<td>'+
        '<button class="btn-acao" onclick="ver('+r.id+')">👁️</button>'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️</button>'+
        '<button class="btn-acao" onclick="excluir('+r.id+')">🗑️</button>'+
      '</td>';
    tbody.appendChild(tr);
  });
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'🦺 Novo')+' EPI';
  ['f_nome','f_ca','f_fab','f_modelo','f_qtd','f_qtdMin','f_colab','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_validade').value='';document.getElementById('f_entrega').value='';
  document.getElementById('f_categoria').value='protecao-cabeca';document.getElementById('f_status').value='disponivel';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  carregarColabs();
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_nome').value=r.nome||'';document.getElementById('f_ca').value=r.ca||'';
    document.getElementById('f_categoria').value=r.categoria||'protecao-cabeca';document.getElementById('f_fab').value=r.fabricante||'';
    document.getElementById('f_modelo').value=r.modelo||'';document.getElementById('f_qtd').value=r.qtd!==undefined?r.qtd:'';
    document.getElementById('f_qtdMin').value=r.qtdMin!==undefined?r.qtdMin:'';document.getElementById('f_validade').value=r.validade||'';
    document.getElementById('f_status').value=r.status||'disponivel';document.getElementById('f_colab').value=r.colaborador||'';
    document.getElementById('f_entrega').value=r.entrega||'';document.getElementById('f_obs').value=r.obs||'';
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var nome=document.getElementById('f_nome').value.trim();
  var ca=document.getElementById('f_ca').value.trim();
  if(!nome||!ca){alert('Preencha Nome e Número do CA.');return;}
  var dados={nome:nome,ca:ca,categoria:document.getElementById('f_categoria').value,fabricante:document.getElementById('f_fab').value.trim(),modelo:document.getElementById('f_modelo').value.trim(),qtd:parseInt(document.getElementById('f_qtd').value)||0,qtdMin:parseInt(document.getElementById('f_qtdMin').value)||0,validade:document.getElementById('f_validade').value,status:document.getElementById('f_status').value,colaborador:document.getElementById('f_colab').value.trim(),entrega:document.getElementById('f_entrega').value,obs:document.getElementById('f_obs').value.trim()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir este EPI?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function ver(id){
  var r=registros.find(function(x){return x.id===id;});
  var sc=getStatusCA(r.validade,r.status);
  function row(l,v){return '<div class="detalhe-row"><span class="detalhe-label">'+l+'</span><span class="detalhe-valor">'+v+'</span></div>';}
  document.getElementById('modalVerConteudo').innerHTML=
    row('Nome',r.nome||'--')+row('CA Nº','<span style="color:#00d4ff">CA '+(r.ca||'--')+'</span>')+
    row('Categoria',r.categoria||'--')+row('Fabricante',r.fabricante||'--')+row('Modelo',r.modelo||'--')+
    row('Estoque',(r.qtd||0)+' unidades (mín: '+(r.qtdMin||0)+')')+
    row('Validade CA',fmt(r.validade))+row('Status','<span class="badge '+sc.cls+'">'+sc.label+'</span>')+
    row('Colaborador',r.colaborador||'--')+row('Data de Entrega',fmt(r.entrega))+
    row('Observações',r.obs||'--')+
    row('Registrado por','<span style="color:#00d4ff">'+(r.registradoPor||'--')+'</span>')+
    row('Registrado em','<span style="color:#00d4ff">'+fmtDT(r.registradoEm)+'</span>');
  document.getElementById('modalVer').classList.add('open');
}
function fecharVer(){document.getElementById('modalVer').classList.remove('open');}
document.getElementById('modalForm').addEventListener('click',function(e){if(e.target===this)fecharModal();});
document.getElementById('modalVer').addEventListener('click',function(e){if(e.target===this)fecharVer();});
renderizar(getLista());
</script>
</body>
</html>
