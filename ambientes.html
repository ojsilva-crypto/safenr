<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — Ambientes de Trabalho</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .btn-novo{background:linear-gradient(135deg,#34d399,#059669);border:none;border-radius:10px;color:#fff;font-size:.9rem;font-weight:700;padding:12px 24px;cursor:pointer;transition:all .2s}
    .btn-novo:hover{opacity:.85;transform:translateY(-1px)}
    .resumo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .resumo-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .rc-valor{font-size:1.8rem;font-weight:900;margin-bottom:4px}
    .rc-label{font-size:.72rem;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .filtros{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
    .filtro-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .2s}
    .filtro-btn:hover,.filtro-btn.active{background:rgba(52,211,153,.12);border-color:#34d399;color:#34d399}
    .busca-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:9px 18px;color:#fff;font-size:.85rem;outline:none;width:240px;margin-left:auto}
    .busca-input::placeholder{color:rgba(255,255,255,.3)}
    .busca-input:focus{border-color:#34d399}
    .ambientes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .amb-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;transition:all .2s;border-top:3px solid transparent}
    .amb-card:hover{background:rgba(255,255,255,.05);transform:translateY(-2px)}
    .amb-card.adequado{border-top-color:#4ade80}
    .amb-card.atencao{border-top-color:#fbbf24}
    .amb-card.critico{border-top-color:#f87171}
    .amb-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .amb-nome{font-size:.95rem;font-weight:700}
    .badge{padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700}
    .badge.adequado{background:rgba(74,222,128,.15);color:#4ade80}
    .badge.atencao{background:rgba(251,191,36,.15);color:#fbbf24}
    .badge.critico{background:rgba(248,113,113,.15);color:#f87171}
    .badge.producao{background:rgba(0,212,255,.12);color:#00d4ff}
    .badge.administrativo{background:rgba(129,140,248,.12);color:#818cf8}
    .badge.almoxarifado{background:rgba(251,146,60,.12);color:#fb923c}
    .badge.manutencao{background:rgba(52,211,153,.12);color:#34d399}
    .badge.externo{background:rgba(167,139,250,.12);color:#a78bfa}
    .badge.outro{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
    .amb-info{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .amb-info-row{font-size:.78rem;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:6px}
    .riscos-lista{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
    .risco-tag{font-size:.68rem;padding:3px 8px;border-radius:6px;background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2)}
    .amb-acoes{display:flex;gap:8px;justify-content:flex-end}
    .btn-acao{background:none;border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;padding:6px 12px;font-size:.8rem;color:rgba(255,255,255,.6);transition:all .2s}
    .btn-acao:hover{background:rgba(255,255,255,.08);color:#fff}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);grid-column:1/-1}
    .empty-state div{font-size:3rem;margin-bottom:12px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:#0f1923;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
    .modal h3{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-row.full{grid-template-columns:1fr}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.55)}
    .form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;color:#fff;font-size:.9rem;outline:none;transition:border .2s;font-family:inherit}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#34d399}
    .form-group select option{background:#1a2535}
    .form-group textarea{resize:vertical;min-height:70px}
    .auto-field{background:rgba(0,212,255,.06)!important;border-color:rgba(0,212,255,.2)!important;color:rgba(255,255,255,.6)!important;cursor:not-allowed!important}
    .auto-tag{font-size:.68rem;color:#00d4ff;background:rgba(0,212,255,.1);border-radius:20px;padding:2px 8px;margin-left:6px;font-weight:600}
    .secao-titulo{font-size:.78rem;font-weight:800;color:#34d399;text-transform:uppercase;letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(52,211,153,.15)}
    .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
    .btn-cancelar{padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer}
    .btn-salvar{padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#34d399,#059669);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer}
    .detalhe-row{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .detalhe-row:last-child{border-bottom:none}
    .detalhe-label{font-size:.78rem;color:rgba(255,255,255,.4);min-width:160px;font-weight:600}
    .detalhe-valor{font-size:.88rem;color:#fff;flex:1}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>🏭 Ambientes de Trabalho</h2><span id="totalRegistros">0 ambientes</span></div>
    <button class="btn-novo" onclick="abrirModal()">+ Novo Ambiente</button>
  </div>
  <div class="resumo-grid">
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-adequado" style="color:#4ade80">0</div>
      <div class="rc-label">Adequados</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-atencao" style="color:#fbbf24">0</div>
      <div class="rc-label">Atenção</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-critico" style="color:#f87171">0</div>
      <div class="rc-label">Críticos</div>
    </div>
    <div class="resumo-card">
      <div class="rc-valor" id="cnt-colabs" style="color:#00d4ff">0</div>
      <div class="rc-label">Total Colaboradores</div>
    </div>
  </div>
  <div class="filtros">
    <button class="filtro-btn active" id="fb-todos"   onclick="filtrar('',this)">Todos</button>
    <button class="filtro-btn" id="fb-adeq"    onclick="filtrar('adequado',this)">✅ Adequados</button>
    <button class="filtro-btn" id="fb-aten"    onclick="filtrar('atencao',this)">⚠️ Atenção</button>
    <button class="filtro-btn" id="fb-crit"    onclick="filtrar('critico',this)">🔴 Críticos</button>
    <input class="busca-input" type="text" placeholder="🔎 Buscar ambiente..." oninput="renderizar(getLista())"/>
  </div>
  <div class="ambientes-grid" id="ambientesGrid"></div>
</div>

<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <h3 id="modalTitulo">🏭 Novo Ambiente de Trabalho</h3>
    <div class="secao-titulo">Identificação</div>
    <div class="form-row full">
      <div class="form-group">
        <label>Nome do Ambiente *</label>
        <input type="text" id="f_nome" placeholder="Ex: Linha de Produção 2"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo de Ambiente</label>
        <select id="f_tipo">
          <option value="producao">Produção</option>
          <option value="administrativo">Administrativo</option>
          <option value="almoxarifado">Almoxarifado</option>
          <option value="manutencao">Manutenção</option>
          <option value="externo">Externo / Campo</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Condição Geral</label>
        <select id="f_condicao">
          <option value="adequado">Adequado</option>
          <option value="atencao">Atenção</option>
          <option value="critico">Crítico</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nº de Colaboradores</label>
        <input type="number" id="f_colabs" placeholder="Ex: 25" min="0"/>
      </div>
      <div class="form-group">
        <label>Responsável pelo Setor</label>
        <input type="text" id="f_resp" placeholder="Nome do responsável"/>
      </div>
    </div>
    <div class="secao-titulo">Agentes de Risco</div>
    <div class="form-row">
      <div class="form-group">
        <label>Agentes Físicos</label>
        <input type="text" id="f_fisicos" placeholder="Ex: Ruído, calor, vibração"/>
      </div>
      <div class="form-group">
        <label>Agentes Químicos</label>
        <input type="text" id="f_quimicos" placeholder="Ex: Poeiras, solventes"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Agentes Biológicos</label>
        <input type="text" id="f_biologicos" placeholder="Ex: Fungos, bactérias"/>
      </div>
      <div class="form-group">
        <label>Riscos Ergonômicos</label>
        <input type="text" id="f_ergonomicos" placeholder="Ex: Postura inadequada"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Riscos de Acidentes</label>
        <input type="text" id="f_acidentes" placeholder="Ex: Queda, choque elétrico"/>
      </div>
    </div>
    <div class="secao-titulo">Medições e Controles</div>
    <div class="form-row">
      <div class="form-group">
        <label>Última Medição / Inspeção</label>
        <input type="date" id="f_medicao"/>
      </div>
      <div class="form-group">
        <label>Próxima Revisão</label>
        <input type="date" id="f_proxRev"/>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Medidas de Controle Existentes</label>
        <textarea id="f_controles" placeholder="EPCs, EPIs, procedimentos adotados..."></textarea>
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Observações</label>
        <textarea id="f_obs" placeholder="Informações adicionais..."></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Registrado por <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regPor" class="auto-field" readonly/>
      </div>
      <div class="form-group">
        <label>Registrado em <span class="auto-tag">AUTO</span></label>
        <input type="text" id="f_regEm" class="auto-field" readonly/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvar()">💾 Salvar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalVer">
  <div class="modal">
    <h3>🏭 Detalhes do Ambiente</h3>
    <div id="modalVerConteudo"></div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharVer()">Fechar</button>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var userData2=localStorage.getItem('safenr_user');
var user2=userData2?JSON.parse(userData2):{};
var registros=JSON.parse(localStorage.getItem('safenr_ambientes')||'[]');
var editandoId=null,filtroAtivo='';
function salvarStorage(){localStorage.setItem('safenr_ambientes',JSON.stringify(registros));}
function fmt(d){if(!d)return '--';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDT(iso){if(!iso)return '--';return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function getLista(){
  var busca=document.querySelector('.busca-input').value.toLowerCase();
  return registros.filter(function(r){
    if(filtroAtivo&&r.condicao!==filtroAtivo)return false;
    if(busca&&!(r.nome||'').toLowerCase().includes(busca)&&!(r.responsavel||'').toLowerCase().includes(busca))return false;
    return true;
  });
}
function filtrar(s,btn){filtroAtivo=s;document.querySelectorAll('.filtro-btn').forEach(function(b){b.classList.remove('active');});if(btn)btn.classList.add('active');renderizar(getLista());}
function atualizarContadores(){
  document.getElementById('cnt-adequado').textContent=registros.filter(function(r){return r.condicao==='adequado';}).length;
  document.getElementById('cnt-atencao').textContent=registros.filter(function(r){return r.condicao==='atencao';}).length;
  document.getElementById('cnt-critico').textContent=registros.filter(function(r){return r.condicao==='critico';}).length;
  document.getElementById('cnt-colabs').textContent=registros.reduce(function(a,r){return a+(parseInt(r.colaboradores)||0);},0);
  document.getElementById('totalRegistros').textContent=registros.length+' ambiente(s)';
}
function renderizar(lista){
  var grid=document.getElementById('ambientesGrid');
  grid.innerHTML='';atualizarContadores();
  if(lista.length===0){grid.innerHTML='<div class="empty-state"><div>🏭</div><p>Nenhum ambiente cadastrado.<br>Clique em <strong>+ Novo Ambiente</strong>.</p></div>';return;}
  lista.forEach(function(r){
    var riscos=[];
    if(r.fisicos)riscos.push(r.fisicos);
    if(r.quimicos)riscos.push(r.quimicos);
    if(r.biologicos)riscos.push(r.biologicos);
    if(r.ergonomicos)riscos.push(r.ergonomicos);
    if(r.acidentes)riscos.push(r.acidentes);
    var div=document.createElement('div');
    div.className='amb-card '+(r.condicao||'adequado');
    div.innerHTML=
      '<div class="amb-header">'+
        '<div class="amb-nome">'+(r.nome||'--')+'</div>'+
        '<span class="badge '+(r.condicao||'adequado')+'">'+(r.condicao||'adequado')+'</span>'+
      '</div>'+
      '<div class="amb-info">'+
        '<div class="amb-info-row">🏷️ <span class="badge '+(r.tipo||'outro')+'" style="font-size:.68rem">'+(r.tipo||'outro')+'</span></div>'+
        '<div class="amb-info-row">👷 '+(r.colaboradores||0)+' colaboradores</div>'+
        '<div class="amb-info-row">👤 '+(r.responsavel||'--')+'</div>'+
        (r.medicao?'<div class="amb-info-row">🔬 Última medição: '+fmt(r.medicao)+'</div>':'')+
        (r.proxRev?'<div class="amb-info-row">📅 Próx. revisão: '+fmt(r.proxRev)+'</div>':'')+
      '</div>'+
      (riscos.length>0?'<div class="riscos-lista">'+riscos.map(function(t){return '<span class="risco-tag">⚠️ '+t+'</span>';}).join('')+'</div>':'')+
      '<div class="amb-acoes">'+
        '<button class="btn-acao" onclick="ver('+r.id+')">👁️ Ver</button>'+
        '<button class="btn-acao" onclick="abrirModal('+r.id+')">✏️</button>'+
        '<button class="btn-acao" onclick="excluir('+r.id+')" style="color:rgba(248,113,113,.7)">🗑️</button>'+
      '</div>';
    grid.appendChild(div);
  });
}
function abrirModal(id){
  editandoId=id||null;
  document.getElementById('modalTitulo').textContent=(id?'✏️ Editar':'🏭 Novo')+' Ambiente';
  ['f_nome','f_resp','f_fisicos','f_quimicos','f_biologicos','f_ergonomicos','f_acidentes','f_controles','f_obs'].forEach(function(f){document.getElementById(f).value='';});
  document.getElementById('f_colabs').value='';document.getElementById('f_medicao').value='';document.getElementById('f_proxRev').value='';
  document.getElementById('f_tipo').value='producao';document.getElementById('f_condicao').value='adequado';
  document.getElementById('f_regPor').value=user2.nome||'Usuario';
  document.getElementById('f_regEm').value=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(id){
    var r=registros.find(function(x){return x.id===id;});
    document.getElementById('f_nome').value=r.nome||'';document.getElementById('f_tipo').value=r.tipo||'producao';
    document.getElementById('f_condicao').value=r.condicao||'adequado';document.getElementById('f_colabs').value=r.colaboradores||'';
    document.getElementById('f_resp').value=r.responsavel||'';document.getElementById('f_fisicos').value=r.fisicos||'';
    document.getElementById('f_quimicos').value=r.quimicos||'';document.getElementById('f_biologicos').value=r.biologicos||'';
    document.getElementById('f_ergonomicos').value=r.ergonomicos||'';document.getElementById('f_acidentes').value=r.acidentes||'';
    document.getElementById('f_medicao').value=r.medicao||'';document.getElementById('f_proxRev').value=r.proxRev||'';
    document.getElementById('f_controles').value=r.controles||'';document.getElementById('f_obs').value=r.obs||'';
    document.getElementById('f_regPor').value=r.registradoPor||user2.nome;document.getElementById('f_regEm').value=fmtDT(r.registradoEm);
  }
  document.getElementById('modalForm').classList.add('open');
}
function fecharModal(){document.getElementById('modalForm').classList.remove('open');editandoId=null;}
function salvar(){
  var nome=document.getElementById('f_nome').value.trim();
  if(!nome){alert('Preencha o Nome do Ambiente.');return;}
  var dados={nome:nome,tipo:document.getElementById('f_tipo').value,condicao:document.getElementById('f_condicao').value,colaboradores:parseInt(document.getElementById('f_colabs').value)||0,responsavel:document.getElementById('f_resp').value.trim(),fisicos:document.getElementById('f_fisicos').value.trim(),quimicos:document.getElementById('f_quimicos').value.trim(),biologicos:document.getElementById('f_biologicos').value.trim(),ergonomicos:document.getElementById('f_ergonomicos').value.trim(),acidentes:document.getElementById('f_acidentes').value.trim(),medicao:document.getElementById('f_medicao').value,proxRev:document.getElementById('f_proxRev').value,controles:document.getElementById('f_controles').value.trim(),obs:document.getElementById('f_obs').value.trim()};
  if(editandoId){var idx=registros.findIndex(function(r){return r.id===editandoId;});registros[idx]=Object.assign({},registros[idx],dados);}
  else{var nId=registros.length>0?Math.max.apply(null,registros.map(function(r){return r.id;}))+1:1;registros.push(Object.assign({id:nId,registradoPor:user2.nome||'Usuario',registradoEm:new Date().toISOString()},dados));}
  salvarStorage();fecharModal();renderizar(getLista());
}
function excluir(id){if(!confirm('Excluir este ambiente?'))return;registros=registros.filter(function(r){return r.id!==id;});salvarStorage();renderizar(getLista());}
function ver(id){
  var r=registros.find(function(x){return x.id===id;});
  function row(l,v){return '<div class="detalhe-row"><span class="detalhe-label">'+l+'</span><span class="detalhe-valor">'+v+'</span></div>';}
  document.getElementById('modalVerConteudo').innerHTML=
    row('Nome',r.nome||'--')+row('Tipo','<span class="badge '+(r.tipo||'outro')+'">'+(r.tipo||'--')+'</span>')+
    row('Condição Geral','<span class="badge '+(r.condicao||'adequado')+'">'+(r.condicao||'--')+'</span>')+
    row('Colaboradores',(r.colaboradores||0)+' pessoas')+row('Responsável',r.responsavel||'--')+
    row('Agentes Físicos',r.fisicos||'--')+row('Agentes Químicos',r.quimicos||'--')+
    row('Agentes Biológicos',r.biologicos||'--')+row('Riscos Ergonômicos',r.ergonomicos||'--')+
    row('Riscos de Acidentes',r.acidentes||'--')+
    row('Última Medição',fmt(r.medicao))+row('Próx. Revisão',fmt(r.proxRev))+
    row('Medidas de Controle',r.controles||'--')+row('Observações',r.obs||'--')+
    row('Registrado por','<span style="color:#00d4ff">'+(r.registradoPor||'--')+'</span>')+
    row('Registrado em','<span style="color:#00d4ff">'+fmtDT(r.registradoEm)+'</span>');
  document.getElementById('modalVer').classList.add('open');
}
