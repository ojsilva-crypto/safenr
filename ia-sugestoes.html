<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SafeNR — IA Sugestões</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f1923;color:#fff;display:flex;min-height:100vh}
    .main{margin-left:240px;flex:1;padding:32px;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .topbar h2{font-size:1.4rem;font-weight:700}
    .topbar span{color:rgba(255,255,255,.4);font-size:.85rem}
    .ia-layout{display:grid;grid-template-columns:340px 1fr;gap:20px;flex:1}
    .ia-sidebar{display:flex;flex-direction:column;gap:14px}
    .ia-context-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px}
    .ia-context-card h4{font-size:.82rem;font-weight:800;color:#00d4ff;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .context-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}
    .context-item:last-child{border-bottom:none}
    .context-label{color:rgba(255,255,255,.45)}
    .context-valor{font-weight:700;color:#fff}
    .context-valor.alerta{color:#f87171}
    .context-valor.ok{color:#4ade80}
    .context-valor.aviso{color:#fbbf24}
    .sugestoes-rapidas{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px}
    .sugestoes-rapidas h4{font-size:.82rem;font-weight:800;color:#a78bfa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
    .sugestao-btn{width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;color:rgba(255,255,255,.7);font-size:.8rem;cursor:pointer;transition:all .2s;margin-bottom:8px;line-height:1.4}
    .sugestao-btn:hover{background:rgba(167,139,250,.1);border-color:#a78bfa;color:#fff}
    .ia-chat{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
    .chat-header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px}
    .ia-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
    .ia-nome{font-weight:700;font-size:.9rem}
    .ia-status{font-size:.72rem;color:#4ade80;display:flex;align-items:center;gap:4px}
    .ia-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block}
    .chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:400px;max-height:calc(100vh - 320px)}
    .msg{max-width:80%;display:flex;flex-direction:column;gap:4px}
    .msg.user{align-self:flex-end;align-items:flex-end}
    .msg.ia{align-self:flex-start;align-items:flex-start}
    .msg-bubble{padding:12px 16px;border-radius:14px;font-size:.85rem;line-height:1.6;white-space:pre-wrap}
    .msg.user .msg-bubble{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-bottom-right-radius:4px}
    .msg.ia .msg-bubble{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);border-bottom-left-radius:4px;border:1px solid rgba(255,255,255,.08)}
    .msg-time{font-size:.68rem;color:rgba(255,255,255,.25)}
    .msg.ia .msg-bubble.digitando{display:flex;align-items:center;gap:6px;padding:14px 18px}
    .dot-anim{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);animation:bounce .9s infinite}
    .dot-anim:nth-child(2){animation-delay:.2s}
    .dot-anim:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
    .chat-input-area{padding:16px 20px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:10px;align-items:flex-end}
    .chat-input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;color:#fff;font-size:.88rem;outline:none;resize:none;max-height:120px;font-family:inherit;transition:border .2s}
    .chat-input:focus{border-color:#a78bfa}
    .chat-input::placeholder{color:rgba(255,255,255,.3)}
    .btn-enviar{background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:10px;color:#fff;width:42px;height:42px;font-size:1rem;cursor:pointer;transition:all .2s;flex-shrink:0}
    .btn-enviar:hover{opacity:.85;transform:scale(1.05)}
    .btn-limpar{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:rgba(255,255,255,.5);width:42px;height:42px;font-size:.9rem;cursor:pointer;transition:all .2s;flex-shrink:0}
    .btn-limpar:hover{background:rgba(255,255,255,.1);color:#fff}
  </style>
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><h2>🤖 Assistente IA — SafeNR</h2><span>Análises e sugestões baseadas nos dados do sistema</span></div>
  </div>
  <div class="ia-layout">
    <div class="ia-sidebar">
      <div class="ia-context-card">
        <h4>📊 Contexto Atual</h4>
        <div id="contextLista"></div>
      </div>
      <div class="sugestoes-rapidas">
        <h4>⚡ Perguntas Rápidas</h4>
        <button class="sugestao-btn" onclick="perguntaRapida('Quais são os riscos críticos sem medida de controle cadastrada?')">⚠️ Riscos críticos sem controle</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Quais treinamentos estão com certificado vencido ou prestes a vencer?')">🎓 Treinamentos vencidos</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Quais planos de ação estão atrasados?')">📌 Planos de ação atrasados</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Faça uma análise geral da situação de segurança da empresa baseada nos dados do sistema')">📊 Análise geral SST</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Quais colaboradores estão com ASO vencido ou próximo de vencer?')">🏥 ASOs vencidos</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Sugira melhorias para reduzir o número de ocorrências registradas')">💡 Sugestões de melhoria</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Quais EPIs estão com CA vencido ou com estoque abaixo do mínimo?')">🦺 EPIs críticos</button>
        <button class="sugestao-btn" onclick="perguntaRapida('Gere um resumo executivo de SST para apresentar à diretoria')">📋 Resumo executivo</button>
      </div>
    </div>
    <div class="ia-chat">
      <div class="chat-header">
        <div class="ia-avatar">🤖</div>
        <div>
          <div class="ia-nome">SafeNR IA</div>
          <div class="ia-status">Online — analisando dados do sistema</div>
        </div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Pergunte sobre segurança, riscos, treinamentos, ocorrências..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar();}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button class="btn-limpar" onclick="limparChat()" title="Limpar conversa">🗑️</button>
        <button class="btn-enviar" onclick="enviar()" title="Enviar">➤</button>
      </div>
    </div>
  </div>
</div>

<script src="./sidebar.js"></script>
<script>
var historico=JSON.parse(localStorage.getItem('safenr_ia_historico')||'[]');
function getCtx(){
  var treins   =JSON.parse(localStorage.getItem('safenr_treinamentos')||'[]');
  var riscos   =JSON.parse(localStorage.getItem('safenr_riscos')||'[]');
  var ocorrs   =JSON.parse(localStorage.getItem('safenr_ocorrencias')||'[]');
  var planos   =JSON.parse(localStorage.getItem('safenr_planos')||'[]');
  var colabs   =JSON.parse(localStorage.getItem('safenr_colaboradores')||'[]');
  var epis     =JSON.parse(localStorage.getItem('safenr_epis')||'[]');
  var docs     =JSON.parse(localStorage.getItem('safenr_documentos')||'[]');
  var insp     =JSON.parse(localStorage.getItem('safenr_inspecoes')||'[]');
  var hoje     =new Date();hoje.setHours(0,0,0,0);
  function isVenc(d){return d&&new Date(d+'T00:00:00')<hoje;}
  function em30(d){if(!d)return false;var diff=(new Date(d+'T00:00:00')-hoje)/86400000;return diff>=0&&diff<=30;}
  function calcS(p){if(p.status==='concluido'||p.status==='cancelado')return p.status;if(p.quando&&new Date(p.quando+'T00:00:00')<hoje)return 'atrasado';return p.status||'aberto';}
  return{
    totalColabs:colabs.length,
    colabsAtivos:colabs.filter(function(c){return c.status==='ativo';}).length,
    asoVencidos:colabs.filter(function(c){return isVenc(c.asoVal);}).length,
    totalRiscos:riscos.length,
    riscosCriticos:riscos.filter(function(r){return r.nivel==='critico';}).length,
    riscosSemControle:riscos.filter(function(r){return r.nivel==='critico'&&!r.medida;}).length,
    totalTreins:treins.length,
    treinsVencidos:treins.filter(function(t){return isVenc(t.dataVal);}).length,
    treinsA30:treins.filter(function(t){return em30(t.dataVal)&&!isVenc(t.dataVal);}).length,
    totalOcorrs:ocorrs.length,
    acidentes:ocorrs.filter(function(o){return o.tipo==='acidente';}).length,
    diasAfastamento:ocorrs.reduce(function(a,o){return a+(parseInt(o.diasAfastamento)||0);},0),
    planosAtrasados:planos.filter(function(p){return calcS(p)==='atrasado';}).length,
    planosPendentes:planos.filter(function(p){return calcS(p)==='aberto';}).length,
    episVencidos:epis.filter(function(e){return isVenc(e.validade);}).length,
    episBaixoEstoque:epis.filter(function(e){return e.qtdMin&&e.qtd<=e.qtdMin;}).length,
    docsVencidos:docs.filter(function(d){return isVenc(d.validade);}).length,
    totalInspecoes:insp.length,
    inspecoesConc:insp.filter(function(i){return i.status==='concluida';}).length,
    mediaInspPont:insp.filter(function(i){return i.pontuacao!==''&&i.pontuacao!=null;}).length>0?
      Math.round(insp.filter(function(i){return i.pontuacao!==''&&i.pontuacao!=null;}).reduce(function(a,i){return a+parseFloat(i.pontuacao);},0)/insp.filter(function(i){return i.pontuacao!==''&&i.pontuacao!=null;}).length):null
  };
}
function renderCtx(){
  var c=getCtx();
  var items=[
    {l:'Colaboradores Ativos',v:c.colabsAtivos,cls:'ok'},
    {l:'ASOs Vencidos',v:c.asoVencidos,cls:c.asoVencidos>0?'alerta':'ok'},
    {l:'Riscos Críticos',v:c.riscosCriticos,cls:c.riscosCriticos>0?'alerta':'ok'},
    {l:'Riscos Sem Controle',v:c.riscosSemControle,cls:c.riscosSemControle>0?'alerta':'ok'},
    {l:'Cert. Vencidos',v:c.treinsVencidos,cls:c.treinsVencidos>0?'alerta':'ok'},
    {l:'Acidentes no Período',v:c.acidentes,cls:c.acidentes>0?'alerta':'ok'},
    {l:'Planos Atrasados',v:c.planosAtrasados,cls:c.planosAtrasados>0?'aviso':'ok'},
    {l:'EPIs Vencidos',v:c.episVencidos,cls:c.episVencidos>0?'aviso':'ok'},
    {l:'Média Inspeções',v:c.mediaInspPont!==null?c.mediaInspPont+'%':'--',cls:c.mediaInspPont>=80?'ok':c.mediaInspPont>=60?'aviso':'alerta'}
  ];
  document.getElementById('contextLista').innerHTML=items.map(function(i){
    return '<div class="context-item"><span class="context-label">'+i.l+'</span><span class="context-valor '+i.cls+'">'+i.v+'</span></div>';
  }).join('');
}
function gerarResposta(pergunta){
  var c=getCtx();
  var p=pergunta.toLowerCase();
  var r='';
  if(p.includes('risco')&&(p.includes('crítico')||p.includes('critico')||p.includes('controle'))){
    if(c.riscosCriticos===0)r='✅ Ótima notícia! Não há riscos críticos cadastrados no momento.\n\nRecomendo continuar realizando inspeções regulares e mantendo os registros atualizados.';
    else{
      r='⚠️ **Análise de Riscos Críticos**\n\n';
      r+='• Total de riscos críticos: **'+c.riscosCriticos+'**\n';
      r+='• Riscos sem medida de controle: **'+c.riscosSemControle+'**\n\n';
      if(c.riscosSemControle>0){
        r+='🚨 **ATENÇÃO:** Existem '+c.riscosSemControle+' risco(s) crítico(s) sem medida de controle definida. Isso representa exposição imediata dos trabalhadores.\n\n';
        r+='**Ações recomendadas:**\n';
        r+='1. Acesse o módulo **Riscos** e identifique os registros sem medida de controle\n';
        r+='2. Defina EPCs e/ou EPIs adequados para cada risco\n';
        r+='3. Crie planos de ação no módulo **Plano de Ação** para implementação\n';
        r+='4. Estabeleça prazos e responsáveis para cada ação\n';
        r+='5. Documente no **PGR** conforme exigido pela NR-1';
      } else r+='✅ Todos os riscos críticos possuem medidas de controle definidas. Verifique periodicamente a eficácia dessas medidas.';
    }
  } else if(p.includes('treinamento')&&(p.includes('vencido')||p.includes('vencer')||p.includes('certificado'))){
    r='🎓 **Análise de Treinamentos**\n\n';
    r+='• Certificados vencidos: **'+c.treinsVencidos+'**\n';
    r+='• Vencerão em 30 dias: **'+c.treinsA30+'**\n';
    r+='• Total de treinamentos: **'+c.totalTreins+'**\n\n';
    if(c.treinsVencidos>0||c.treinsA30>0){
      r+='**Ações recomendadas:**\n';
      r+='1. Acesse o módulo **Treinamentos** e filtre por "Vencidos"\n';
      r+='2. Programe reciclagens com antecedência mínima de 30 dias\n';
      r+='3. Verifique NRs aplicáveis: NR-10 (2 anos), NR-35 (2 anos), NR-33 (1 ano)\n';
      r+='4. Emita novos certificados após conclusão e atualize os registros\n';
      r+='5. Configure alertas no módulo **Notificações** para avisos automáticos';
    } else r+='✅ Todos os certificados estão dentro da validade. Continue monitorando pelo módulo **Notificações**.';
  } else if(p.includes('plano')&&(p.includes('atrasado')||p.includes('prazo'))){
    r='📌 **Análise de Planos de Ação**\n\n';
    r+='• Planos atrasados: **'+c.planosAtrasados+'**\n';
    r+='• Planos em aberto: **'+c.planosPendentes+'**\n\n';
    if(c.planosAtrasados>0){
      r+='🔴 Existem '+c.planosAtrasados+' plano(s) com prazo vencido!\n\n';
      r+='**Ações recomendadas:**\n';
      r+='1. Acesse o módulo **Plano de Ação** e filtre por "Atrasados"\n';
      r+='2. Contate os responsáveis e verifique o andamento\n';
      r+='3. Revise os prazos se necessário, justificando a prorrogação\n';
      r+='4. Priorize ações vinculadas a riscos críticos\n';
      r+='5. Registre evidências de execução e conclua os itens finalizados';
    } else r+='✅ Nenhum plano de ação atrasado. Continue acompanhando os prazos regularmente.';
  } else if(p.includes('aso')||p.includes('exame')||(p.includes('colaborador')&&p.includes('vencido'))){
    r='🏥 **Análise de ASOs — Atestados de Saúde Ocupacional**\n\n';
    r+='• Colaboradores com ASO vencido: **'+c.asoVencidos+'**\n';
    r+='• Total de colaboradores ativos: **'+c.colabsAtivos+'**\n\n';
    if(c.asoVencidos>0){
      r+='⚠️ Existem '+c.asoVencidos+' colaborador(es) com ASO vencido. Isso pode gerar passivo trabalhista!\n\n';
      r+='**Ações recomendadas:**\n';
      r+='1. Acesse o módulo **Colaboradores** e identifique os ASOs vencidos\n';
      r+='2. Agende exames periódicos com o médico do trabalho\n';
      r+='3. Colaboradores em funções com riscos específicos têm prioridade\n';
      r+='4. Documente no **PCMSO** conforme NR-7\n';
      r+='5. Mantenha os ASOs arquivados por no mínimo 20 anos';
    } else r+='✅ Todos os ASOs estão dentro da validade. Programe os próximos exames com 30 dias de antecedência.';
  } else if(p.includes('análise geral')||p.includes('analise geral')||p.includes('situação')||p.includes('situacao')){
    var score=100;
    var alertas=[];
    if(c.riscosSemControle>0){score-=20;alertas.push('🔴 '+c.riscosSemControle+' risco(s) crítico(s) sem controle');}
    if(c.asoVencidos>0){score-=10;alertas.push('🟠 '+c.asoVencidos+' ASO(s) vencido(s)');}
    if(c.treinsVencidos>0){score-=10;alertas.push('🟠 '+c.treinsVencidos+' certificado(s) vencido(s)');}
    if(c.planosAtrasados>0){score-=8;alertas.push('🟡 '+c.planosAtrasados+' plano(s) atrasado(s)');}
    if(c.episVencidos>0){score-=7;alertas.push('🟡 '+c.episVencidos+' EPI(s) com CA vencido');}
    if(c.acidentes>0){score-=5;alertas.push('🔴 '+c.acidentes+' acidente(s) registrado(s)');}
    var nivel=score>=80?'BOM ✅':score>=60?'REGULAR ⚠️':'CRÍTICO 🔴';
    r='📊 **Análise Geral de Segurança do Trabalho**\n\n';
    r+='**Índice de Conformidade: '+score+'/100 — '+nivel+'**\n\n';
    if(alertas.length>0){r+='**Pontos de Atenção:**\n'+alertas.map(function(a){return '• '+a;}).join('\n')+'\n\n';}
    r+='**Resumo do Sistema:**\n';
    r+='• '+c.colabsAtivos+' colaboradores ativos\n';
    r+='• '+c.totalRiscos+' riscos mapeados ('+c.riscosCriticos+' críticos)\n';
    r+='• '+c.totalTreins+' treinamentos cadastrados\n';
    r+='• '+c.totalOcorrs+' ocorrências registradas\n';
    r+='• '+c.diasAfastamento+' dias de afastamento acumulados\n';
    r+='• '+c.totalInspecoes+' inspeções realizadas'+(c.mediaInspPont!==null?' (média: '+c.mediaInspPont+'%)':'')+'\n\n';
    r+='**Recomendações Prioritárias:**\n';
    if(c.riscosSemControle>0)r+='1. 🔴 Definir controles para os '+c.riscosSemControle+' risco(s) crítico(s) sem medida\n';
    if(c.asoVencidos>0)r+='2. 🟠 Agendar exames para os '+c.asoVencidos+' colaborador(es) com ASO vencido\n';
    if(c.treinsVencidos>0)r+='3. 🟠 Programar reciclagem para '+c.treinsVencidos+' treinamento(s) vencido(s)\n';
    if(c.planosAtrasados>0)r+='4. 🟡 Revisar e concluir os '+c.planosAtrasados+' plano(s) de ação atrasado(s)\n';
    if(alertas.length===0)r+='✅ Sistema em excelente conformidade! Mantenha os registros atualizados.';
  } else if(p.includes('epi')&&(p.includes('vencido')||p.includes('estoque')||p.includes('ca')||p.includes('crítico'))){
    r='🦺 **Análise de EPIs**\n\n';
    r+='• EPIs com CA vencido: **'+c.episVencidos+'**\n';
    r+='• EPIs com estoque abaixo do mínimo: **'+c.episBaixoEstoque+'**\n\n';
    if(c.episVencidos>0||c.episBaixoEstoque>0){
      r+='**Ações recomendadas:**\n';
      r+='1. Acesse o módulo **EPIs** e filtre por "Vencidos"\n';
      r+='2. Substitua imediatamente EPIs com CA vencido — uso é proibido pelo MTE\n';
      r+='3. Realize compras para os itens com estoque crítico\n';
      r+='4. Consulte o site do MTE para verificar CAs ativos: consultaca.mte.gov.br\n';
      r+='5. Exija comprovante de entrega assinado pelo colaborador (ficha de EPI)';
    } else r+='✅ Todos os EPIs estão regulares. Continue monitorando os prazos de validade.';
  } else if(p.includes('melhoria')||p.includes('reduzir')||p.includes('diminuir')){
    r='💡 **Sugestões de Melhoria — Prevenção de Acidentes**\n\n';
    r+='Com base nos dados do sistema, aqui estão as principais recomendações:\n\n';
    r+='**1. Gestão de Riscos**\n';
    r+='• Realize inspeções semanais nos ambientes de trabalho\n';
    r+='• Implemente o conceito de Quase-Acidentes para identificar perigos latentes\n';
    r+='• Utilize a Hierarquia de Controles: Eliminação > Substituição > Eng. > Adm. > EPI\n\n';
    r+='**2. Treinamento e Cultura**\n';
    r+='• Realize DDS (Diálogo Diário de Segurança) de 5 minutos todos os dias\n';
    r+='• Envolva os trabalhadores na identificação de riscos\n';
    r+='• Reconheça comportamentos seguros publicamente\n\n';
    r+='**3. Gestão de Indicadores**\n';
    r+='• Acompanhe: TAF (Taxa de Acidentabilidade), TG (Taxa de Gravidade), TF (Taxa de Frequência)\n';
    r+='• Estabeleça metas mensais de redução de ocorrências\n';
    r+='• Compartilhe resultados com toda a equipe mensalmente\n\n';
    r+='**4. Conformidade Legal**\n';
    r+='• Mantenha o PGR e PCMSO sempre atualizados (NR-1 e NR-7)\n';
    r+='• Verifique conformidade das máquinas com a NR-12\n';
    r+='• Realize SIPAT anualmente com temas relevantes para a empresa';
  } else if(p.includes('resumo executivo')||p.includes('diretoria')||p.includes('relatório executivo')){
    var dataAtual=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    r='📋 **RESUMO EXECUTIVO DE SST — '+dataAtual.toUpperCase()+'**\n\n';
    r+='**VISÃO GERAL**\n';
    r+='O sistema SafeNR apresenta os seguintes indicadores consolidados:\n\n';
    r+='**CAPITAL HUMANO**\n';
    r+='• Quadro funcional: '+c.totalColabs+' colaboradores ('+c.colabsAtivos+' ativos)\n';
    r+='• ASOs pendentes de renovação: '+c.asoVencidos+'\n\n';
    r+='**ACIDENTES E INCIDENTES**\n';
    r+='• Acidentes registrados: '+c.acidentes+'\n';
    r+='• Dias de afastamento: '+c.diasAfastamento+'\n';
    r+='• Total de ocorrências: '+c.totalOcorrs+'\n\n';
    r+='**GESTÃO DE RISCOS**\n';
    r+='• Riscos mapeados: '+c.totalRiscos+' ('+c.riscosCriticos+' críticos)\n';
    r+='• Riscos sem controle: '+c.riscosSemControle+'\n\n';
    r+='**TREINAMENTOS**\n';
    r+='• Total de treinamentos: '+c.totalTreins+'\n';
    r+='• Certificados vencidos: '+c.treinsVencidos+'\n\n';
    r+='**PLANOS DE AÇÃO**\n';
    r+='• Ações em andamento: '+c.planosPendentes+'\n';
    r+='• Ações atrasadas: '+c.planosAtrasados+'\n\n';
    r+='**INSPEÇÕES**\n';
    r+='• Total realizadas: '+c.totalInspecoes+'\n';
    r+='• Pontuação média: '+(c.mediaInspPont!==null?c.mediaInspPont+'%':'N/D')+'\n\n';
    r+='**PRIORIDADES PARA O PRÓXIMO PERÍODO**\n';
    var prio=1;
    if(c.riscosSemControle>0)r+=prio+++'. Implementar controles para '+c.riscosSemControle+' risco(s) crítico(s)\n';
    if(c.asoVencidos>0)r+=prio+++'. Regularizar '+c.asoVencidos+' ASO(s) vencido(s)\n';
    if(c.treinsVencidos>0)r+=prio+++'. Realizar reciclagem de '+c.treinsVencidos+' treinamento(s)\n';
    if(c.planosAtrasados>0)r+=prio+++'. Concluir '+c.planosAtrasados+' plano(s) de ação atrasado(s)\n';
    if(prio===1)r+='✅ Nenhuma ação urgente identificada.';
  } else {
    r='🤖 **Assistente SafeNR**\n\n';
    r+='Olá! Sou o assistente inteligente do SafeNR. Posso ajudá-lo com:\n\n';
    r+='• 📊 **Análises** dos dados do seu sistema\n';
    r+='• ⚠️ **Alertas** sobre riscos, vencimentos e prazos\n';
    r+='• 💡 **Sugestões** de melhoria em SST\n';
    r+='• 📋 **Relatórios** resumidos para gestão\n';
    r+='• 📚 **Orientações** sobre NRs e conformidade legal\n\n';
    r+='Use os **atalhos rápidos** no painel à esquerda ou digite sua pergunta livremente.\n\n';
    r+='Exemplo: *"Quais são os riscos críticos sem controle?"* ou *"Faça uma análise geral da segurança"*';
  }
  return r;
}
function agora(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function addMsg(texto,tipo){
  var cont=document.getElementById('chatMsgs');
  var div=document.createElement('div');
  div.className='msg '+tipo;
  div.innerHTML='<div class="msg-bubble">'+texto+'</div><div class="msg-time">'+agora()+'</div>';
  cont.appendChild(div);
  cont.scrollTop=cont.scrollHeight;
  return div;
}
function addDigitando(){
  var cont=document.getElementById('chatMsgs');
  var div=document.createElement('div');
  div.className='msg ia';div.id='digitando';
  div.innerHTML='<div class="msg-bubble digitando"><div class="dot-anim"></div><div class="dot-anim"></div><div class="dot-anim"></div></div>';
  cont.appendChild(div);cont.scrollTop=cont.scrollHeight;
}
function remDigitando(){var d=document.getElementById('digitando');if(d)d.remove();}
function enviar(){
  var input=document.getElementById('chatInput');
  var texto=input.value.trim();
  if(!texto)return;
  addMsg(texto,'user');
  historico.push({role:'user',texto:texto,ts:new Date().toISOString()});
  input.value='';input.style.height='auto';
  addDigitando();
  setTimeout(function(){
    remDigitando();
    var resp=gerarResposta(texto);
    addMsg(resp,'ia');
    historico.push({role:'ia',texto:resp,ts:new Date().toISOString()});
    localStorage.setItem('safenr_ia_historico',JSON.stringify(historico.slice(-50)));
  },900+Math.random()*600);
}
function perguntaRapida(texto){
  document.getElementById('chatInput').value=texto;
  enviar();
}
function limparChat(){
  if(!confirm('Limpar todo o histórico da conversa?'))return;
  historico=[];localStorage.removeItem('safenr_ia_historico');
  document.getElementById('chatMsgs').innerHTML='';
  addMsg(gerarResposta('oi'),'ia');
}
renderCtx();
if(historico.length>0){
  historico.forEach(function(m){addMsg(m.texto,m.role==='user'?'user':'ia');});
} else {
  addMsg(gerarResposta('oi'),'ia');
}
</script>
